# XcodeGen spec: GitHub Actions turns this into Murmur.xcodeproj on a Mac (see .github/workflows/ios.yml).
name: Murmur
options:
  bundleIdPrefix: com.murmur
  deploymentTarget:
    iOS: "15.0"
targets:
  Murmur:
    type: application
    platform: iOS
    sources:
      - path: Murmur
    dependencies:
      # The Safari ad blocker ships inside the app (Settings → Apps → Safari → Extensions turns it on).
      - target: MurmurAdBlock
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Murmur
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "7"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murmur.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

  # Safari Web Extension: removes YouTube ads from Murmur in Safari (same scripts as the Chrome extension in extension/).
  MurmurAdBlock:
    type: app-extension
    platform: iOS
    sources:
      - path: MurmurAdBlock/SafariWebExtensionHandler.swift
      # Added file by file (not as a folder) so manifest.json sits at the top of the extension, where Safari looks.
      - path: MurmurAdBlock/Resources
        buildPhase: resources
        excludes:
          - .gitignore
    info:
      path: MurmurAdBlock/Info.plist
      properties:
        CFBundleDisplayName: Murmur Ad Blocker
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "7"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murmur.app.adblock
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
