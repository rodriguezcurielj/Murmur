<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="murmur-build" content="20261015001039">
<meta name="theme-color" content="#120e17">
<meta name="description" content="Murmur: your self-hosted music player.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
</head>
<title>Murmur Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: three-pane shell (library rail · main stage · now-playing card) over a transport bar; phones collapse to stage + mini player + tab bar */
  --bg:#120e17; --panel:#1b1522; --raise:#251d2e; --hover:#2f2639; --line:#3b3048;
  --fg:#f5eff9; --muted:#a798b4; --accent:#ffb070; --accent-ink:#2b1505;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;max-width:100%;overflow-x:hidden}
.app{max-width:100vw}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
img{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:8px;padding:8px}
.app.np-on{grid-template-columns:280px minmax(0,1fr) 310px}
.sidebar{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.main{grid-column:2;grid-row:1}
.np-panel{grid-column:3;grid-row:1}
.app:not(.np-on) .np-panel{display:none}
.player{grid-column:1/-1;grid-row:2}
.bottom-nav{grid-column:1/-1;grid-row:3;display:none}
.panel{background:var(--panel);border-radius:var(--r)}

.nav{padding:18px 12px 10px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:0 12px 14px;font:800 23px/1 var(--font-display);letter-spacing:-.02em}
[data-act="logo-home"]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.brand svg,.m-brand svg{width:26px;height:26px;color:var(--accent)}
.nav-btn{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:8px;font-weight:700;color:var(--muted)}
.nav-btn:hover,.nav-btn.on{color:var(--fg)}
.nav-btn svg{width:22px;height:22px}
.library{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 8px 8px}
.lib-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 10px}
.lib-head h2{margin:0;font:700 15px var(--font-body);color:var(--muted);display:flex;gap:12px;align-items:center}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none;position:relative}
.icon-btn:hover{color:var(--fg);background:var(--hover)}
.icon-btn.on{color:var(--accent)}
.icon-btn.rep-one::after{content:"1";position:absolute;top:3px;right:3px;font-size:9px;font-weight:800;line-height:1}
.chips{display:flex;gap:6px;padding:0 8px 10px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:var(--raise);font-size:13px;font-weight:600}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--fg);color:var(--bg)}
.lib-list{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.lib-item{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:8px;cursor:pointer;min-width:0}
.lib-item:hover{background:var(--raise)}
.lib-item.on{background:var(--hover)}
.lib-item .cover{width:48px;height:48px;border-radius:6px}
.lib-item .meta{min-width:0;flex:1}
.lib-item .nm{font-weight:600}
.lib-item.playing .nm{color:var(--accent)}
.lib-item .sb{font-size:13px;color:var(--muted)}

.cover{object-fit:cover;background:var(--raise);flex:none;aspect-ratio:1;max-width:100%}
.mosaic{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.mosaic img{width:100%;height:100%;object-fit:cover}
.liked-cover{display:grid;place-items:center;background:linear-gradient(140deg,#5b35c9 0%,#c06ad8 55%,#ffb070 100%);color:#fff}
.liked-cover svg{width:42%;height:42%;fill:currentColor}
.round{border-radius:50%!important}

.main{background:var(--panel);border-radius:var(--r);overflow:auto;min-width:0;position:relative;overscroll-behavior:contain;scrollbar-width:thin}
.topbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:12px 24px;background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.topbar .icon-btn{background:var(--bg)}
.topbar .icon-btn:disabled{opacity:.4;cursor:default}
.m-brand{display:none;margin-left:auto;align-items:center;gap:8px;font:800 19px var(--font-display)}
.top-search{flex:1;max-width:460px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;margin-left:6px}
.top-search:focus-within{border-color:var(--fg)}
.top-search>svg{color:var(--muted);width:18px;height:18px}
.top-search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;font-size:15px;padding:9px 0;outline:none}
.top-search input::-webkit-search-cancel-button{display:none}
.tq-clear{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.tq-clear:hover{color:var(--fg);background:var(--hover)}
.tq-clear svg{width:16px;height:16px}
.search-title{font-size:clamp(22px,3vw,28px);overflow-wrap:anywhere}
.top-search{position:relative}
.tq-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.55);padding:6px;max-height:min(70vh,520px);overflow:auto}
.drop-h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 8px 4px}
.drop-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;font-size:14px;min-width:0}
.drop-item:hover,.drop-item.on{background:var(--hover)}
.drop-item img{width:38px;height:38px;border-radius:4px;object-fit:cover;flex:none}
.drop-item>svg{width:16px;height:16px;color:var(--muted);flex:none}
.drop-tx{display:flex;flex-direction:column;min-width:0;flex:1}
.drop-tx span{font-size:12px;color:var(--muted)}
.drop-item>.ell{flex:1}
.drop-all{border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:4px;padding-top:10px}
.drop-item kbd{font:600 11px var(--font-body);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;flex:none}
.yt-wait{margin:0}
.view{padding:4px 24px 48px}

/* ---------- home ---------- */
.greet{font:800 clamp(26px,3.4vw,34px)/1.1 var(--font-display);letter-spacing:-.02em;margin:8px 0 18px;text-wrap:balance}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.qt{display:flex;align-items:center;gap:12px;background:var(--raise);border-radius:6px;overflow:hidden;cursor:pointer;min-width:0;padding-right:10px}
.qt:hover{background:var(--hover)}
.qt .cover{width:60px;height:60px}
.qt .nm{font-weight:700;flex:1;min-width:0}
.qt .fab{position:static;width:36px;height:36px}
.shelf-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 10px}
.shelf-head h2{margin:0;font:700 22px/1.2 var(--font-display);letter-spacing:-.01em}
.shelf-head p{margin:0;color:var(--muted);font-size:14px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,184px);gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -10px;scrollbar-width:thin}
.card{padding:10px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{background:var(--raise)}
.card-art{position:relative}
.card-art .cover{width:100%;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card .nm{font-weight:700}
.card .sb{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fab{position:absolute;right:8px;bottom:8px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.fab svg{width:20px;height:20px}
.card:hover .fab,.qt:hover .fab,.fab:focus-visible,.fab.on{opacity:1;transform:none}
.fab:hover{transform:scale(1.06)!important}

/* ---------- collection ---------- */
.hero{display:flex;gap:24px;align-items:flex-end;padding:28px 24px 24px;margin:-4px -24px 0;background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 46%,var(--panel)) 0%,color-mix(in srgb,var(--tint) 14%,var(--panel)) 100%)}
.hero-cover{width:clamp(140px,20vw,232px);border-radius:8px;box-shadow:0 14px 44px rgba(0,0,0,.5)}
.hero-meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.hero-meta .eyebrow{color:var(--fg)}
.hero h1,.title-input{font:800 clamp(30px,5.4vw,72px)/1.02 var(--font-display);letter-spacing:-.03em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.title-input{background:transparent;border:0;border-bottom:2px dashed transparent;color:var(--fg);width:100%;padding:0;border-radius:0}
.title-input:hover,.title-input:focus{border-bottom-color:color-mix(in srgb,var(--fg) 40%,transparent);outline:none}
.hero-desc{margin:0;color:color-mix(in srgb,var(--fg) 78%,transparent);max-width:60ch}
.hero-sub{margin:0;font-size:14px;color:color-mix(in srgb,var(--fg) 78%,transparent)}
.hero-sub b{color:var(--fg)}
.actions{display:flex;align-items:center;gap:14px;padding:22px 0 18px;flex-wrap:wrap}
.big-play{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.4);transition:transform .15s}
.big-play:hover{transform:scale(1.05)}
.big-play svg{width:24px;height:24px}
.actions .icon-btn{width:42px;height:42px}
.actions .icon-btn svg{width:24px;height:24px}
.text-btn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.text-btn:hover{color:var(--fg);border-color:var(--muted)}
.text-btn.danger{color:#ff8e8e;border-color:#ff8e8e}

.tracks{display:flex;flex-direction:column}
.thead,.row{display:grid;grid-template-columns:28px minmax(0,4fr) minmax(0,3fr) 36px 48px 36px;align-items:center;gap:12px;padding:6px 12px;border-radius:6px}
.thead{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:8px;padding-bottom:8px}
.thead .r{text-align:right}
.row{cursor:pointer}
.row:hover{background:var(--raise)}
.row .num{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;display:flex;justify-content:flex-end}
.row .eq{display:none}
.row.is-current .t{color:var(--accent)}
.row.is-current.is-playing .n{display:none}
.row.is-current.is-playing .eq{display:inline-flex}
.ti{display:flex;gap:12px;align-items:center;min-width:0}
.ti img{width:42px;height:42px;border-radius:4px}
.ti .tx{min-width:0}
.t{display:block;font-weight:600}
.a{display:block;font-size:13px;color:var(--muted)}
.a button:hover,.p-artist:hover,.alb:hover,.full-artist:hover,.np-artist:hover{text-decoration:underline;color:var(--fg)}
.alb{color:var(--muted);font-size:14px;justify-self:start;max-width:100%}
.dur{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.row .icon-btn{width:32px;height:32px}
.row .like,.row .more{opacity:0}
.row:hover .like,.row:hover .more,.row .like.on,.row:focus-within .more{opacity:1}
.like.on{color:var(--accent)}
.like.on svg{fill:currentColor}
.add-btn{padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700}
.add-btn:hover{border-color:var(--fg)}
.row.plain{grid-template-columns:minmax(0,1fr) auto}
.eq{gap:2px;height:14px;align-items:flex-end}
.eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.27s}
.eq i:nth-child(3){animation-delay:-.53s}
@keyframes eq{from{height:3px}to{height:14px}}
.empty{padding:40px 0;color:var(--muted);max-width:46ch}
.empty h2{color:var(--fg);font:700 22px var(--font-display);margin:0 0 6px}

/* ---------- search ---------- */
.search-box{display:flex;align-items:center;gap:10px;background:var(--raise);border-radius:999px;padding:0 18px;max-width:480px;border:1px solid var(--line);margin:6px 0 4px}
.search-box:focus-within{border-color:var(--fg)}
.search-box input{flex:1;background:none;border:0;color:var(--fg);font:inherit;font-size:16px;padding:13px 0;outline:none;min-width:0}
.search-box svg{color:var(--muted)}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.gt{aspect-ratio:1.55;border-radius:10px;padding:14px 16px;font:800 21px/1.1 var(--font-display);position:relative;overflow:hidden;cursor:pointer;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.gt small{font:600 12px var(--font-body);opacity:.8;letter-spacing:.02em}
.gt img{position:absolute;width:44%;right:-6%;bottom:-6%;transform:rotate(18deg);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.gt span{position:relative;z-index:1;max-width:60%}
.artist-chips{display:flex;flex-wrap:wrap;gap:8px}
.ac{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;background:var(--raise);border-radius:999px;font-weight:600}
.ac:hover{background:var(--hover)}
.ac img{width:36px;height:36px;border-radius:50%;object-fit:cover}

/* ---------- player ---------- */
.player{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);align-items:center;gap:16px;padding:6px 8px 2px;min-height:76px;position:relative}
.p-left{display:flex;align-items:center;gap:12px;min-width:0;touch-action:pan-y}
#fCover{touch-action:none}
.full{touch-action:none}
.full.scrolls{touch-action:pan-y}
.full.scrolls .full-top{touch-action:none}
.p-cover{width:56px;height:56px;border-radius:6px;cursor:pointer}
.p-meta{min-width:0}
.p-title{font-weight:700;font-size:14px}
.p-artist,.np-artist,.full-artist{font-size:13px;color:var(--muted);display:block;max-width:100%}
.p-center{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.controls{display:flex;align-items:center;gap:12px}
.play-btn{width:38px;height:38px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;transition:transform .12s;flex:none}
.play-btn:hover{transform:scale(1.06)}
.seek-row{display:flex;align-items:center;gap:10px;width:100%;max-width:640px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seek-row span{min-width:34px;text-align:center}
.p-right{display:flex;justify-content:flex-end;align-items:center;gap:2px}
.vol{width:110px!important}
.p-mini,.p-mini-ctrl,.mini-bar{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fg) var(--p),var(--line) var(--p))}
input[type=range]:hover::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--fg);margin-top:-4px;opacity:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--fg)}
input[type=range]:hover::-moz-range-progress{background:var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--fg)}

/* ---------- now playing panel ---------- */
.np-panel{overflow:auto;min-width:0;padding:16px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.np-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.np-cover{width:100%;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.np-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.np-meta h3{margin:0;font:800 22px/1.15 var(--font-display);letter-spacing:-.01em}
.np-card{background:var(--raise);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.np-card-head{display:flex;justify-content:space-between;align-items:center}
.np-card-head button{font-size:13px;font-weight:700;color:var(--muted)}
.np-card-head button:hover{color:var(--fg);text-decoration:underline}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted);margin:0}
.prog{font-family:var(--font-display);font-weight:600;color:var(--fg);letter-spacing:.02em}

/* ---------- full player ---------- */
.full{position:fixed;inset:0;z-index:40;overflow:auto;background:linear-gradient(180deg,color-mix(in srgb,var(--tint,#5a3478) 55%,var(--bg)) 0%,var(--bg) 78%);padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.full-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.full-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;text-align:center}
.full-top .eyebrow{color:var(--fg);opacity:.8;display:block}
.full-ctx b{font-weight:700;font-size:14px;display:block}
.full-cover{width:min(100%,46vh);align-self:center;border-radius:10px;box-shadow:0 22px 56px rgba(0,0,0,.55)}
#viz{width:100%;height:52px;display:block}
.full-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.full-meta>div{min-width:0}
.full-title{font:800 26px/1.15 var(--font-display);letter-spacing:-.01em}
.full-artist{font-size:15px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.controls.big{justify-content:space-between}
.controls.big .play-btn{width:66px;height:66px}
.controls.big .play-btn svg{width:28px;height:28px}
.controls.big .icon-btn{width:44px;height:44px}
.controls.big .icon-btn svg{width:26px;height:26px}

/* ---------- menu / toast ---------- */
.menu{position:fixed;z-index:60;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:230px;max-width:calc(100vw - 16px);max-height:70vh;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.menu-title{padding:8px 12px 6px;font-size:12px;color:var(--muted);font-weight:700}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:5px;font-size:14px;font-weight:500}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:110;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.toast.show{animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- uploads ---------- */
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.up-btn{display:flex;align-items:center;gap:8px;color:var(--fg);background:var(--bg)}
.dl-dot{display:none;color:var(--accent);margin-right:5px;vertical-align:-2px}
.dl-dot svg{width:13px;height:13px}
.row.is-dl .dl-dot{display:inline-block}
.row.is-dling .t::after{content:" · downloading";color:var(--muted);font-weight:500;font-size:12px}
.dl-btn.on{color:var(--accent)}
.dl-col{font-weight:600}
.dl-note{color:var(--muted);flex-basis:100%}
.dl-note:empty{display:none}
.dl-col svg{width:18px;height:18px}
.dl-btn.busy{color:var(--accent);animation:dlpulse 1.1s ease-in-out infinite}
@keyframes dlpulse{50%{opacity:.35}}
.dl-cover{background:linear-gradient(140deg,#1d6b5a 0%,#3a8f7a 50%,#ffb070 100%)}
.dl-cover svg{fill:none}
.offline-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 16px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--accent) 12%,var(--raise));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);font-size:14px}
.offline-banner>svg{color:var(--accent);flex:none}
.offline-banner span{flex:1;min-width:12rem}
.up-btn svg{width:18px;height:18px}
.drop{display:flex;align-items:center;gap:16px;padding:20px;margin-bottom:20px;border:2px dashed var(--line);border-radius:12px;cursor:pointer;color:var(--fg)}
.drop:hover,.drop:focus-visible{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.drop>svg{width:30px;height:30px;color:var(--accent)}
.drop>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.empty code,.drop code{font-size:13px;background:var(--raise);padding:1px 6px;border-radius:4px}
.up-status{position:fixed;left:16px;bottom:96px;z-index:65;width:min(340px,calc(100vw - 32px));background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.up-track{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.up-track span{display:block;height:100%;background:var(--accent);transition:width .2s}
.drop-overlay{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bg) 80%,transparent);display:grid;place-items:center;padding:16px;cursor:pointer}
.drop-overlay div{border:3px dashed var(--accent);border-radius:16px;padding:48px 32px;color:var(--fg);text-align:center;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.drop-overlay b{font:800 clamp(22px,4vw,34px)/1.15 var(--font-display)}
.drop-overlay span{color:var(--muted);font-size:14px}
.danger-text{color:#ff8e8e}

/* ---------- selection ---------- */
.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.text-btn{display:inline-flex;align-items:center;gap:6px}
.text-btn svg{width:16px;height:16px}
.lib-title{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--muted)}
.lib-title:hover{color:var(--fg)}
.lib-title.on{color:var(--fg)}
.ck{display:none;width:18px;height:18px;border:2px solid var(--muted);border-radius:5px;place-items:center;color:var(--accent-ink);flex:none}
.ck svg{width:12px;height:12px;opacity:0;stroke-width:3}
.tracks.selecting .num .n,.tracks.selecting .num .eq{display:none!important}
.tracks.selecting .ck{display:grid}
.tracks.selecting .row{user-select:none}
.row.selected{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.row.selected:hover{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.row.selected .ck,.lib-item.selected .ck{background:var(--accent);border-color:var(--accent)}
.row.selected .ck svg,.lib-item.selected .ck svg{opacity:1}
.lib-list.selecting .lib-item .ck{display:grid}
.lib-list.selecting .lib-item.nosel{opacity:.45}
.lib-list.selecting .lib-item.nosel .ck{visibility:hidden}
.lib-item.selected{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.restore{margin-top:28px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.sel-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;z-index:66;display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:8px 10px;width:max-content;max-width:calc(100vw - 32px);background:var(--raise);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.sel-count{font-weight:700;font-size:14px;padding:0 8px;font-variant-numeric:tabular-nums}
.sb{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600}
.sb svg{width:16px;height:16px}
.sb:hover:not(:disabled){background:var(--hover)}
.sb:disabled{opacity:.4;cursor:default}
.sb.danger{color:#ff8e8e}
.sb.done{background:var(--fg);color:var(--bg);margin-left:4px}
.sb.done:hover{background:var(--fg)!important;opacity:.9}
.sb-sep{width:1px;align-self:stretch;background:var(--line);margin:4px 4px}

/* ---------- sign-in & people ---------- */
.gate{position:fixed;inset:0;z-index:100;overflow:auto;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--accent) 14%,var(--bg)) 0%,var(--bg) 60%)}
.gate-card{width:min(400px,100%);display:flex;flex-direction:column;gap:6px}
.gate-brand{padding:0 0 22px}
.dls-list{display:grid;gap:8px;margin-top:6px}
.dls-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:inherit;font:inherit;cursor:pointer}
.dls-opt:hover:not(:disabled){background:rgba(255,255,255,.08)}
.dls-opt:disabled{opacity:.5;cursor:default}
.dls-opt svg{width:20px;height:20px;flex:none;color:var(--accent)}
.dls-opt b{display:block}
.ytp-frame{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;margin:8px 0}
.ytp-frame iframe{width:100%;height:100%;border:0}
.ytp-ver{align-items:center;min-width:0}
.ytp-ver>span{flex:1;min-width:0}
.ytp-ver b,.ytp-ver .small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver-list:has(.ytp-ver){overflow-x:hidden}
.ytdl{display:flex;flex-direction:column;gap:10px}
.ytdl-song{display:flex;align-items:center;gap:12px;min-width:0}
.ytdl-song img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--raise)}
.ytdl-song>span{min-width:0}
.ytdl-song b,.ytdl-song .small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ytdl-stage{color:var(--fg);font-weight:600;margin-top:4px}
.ytdl-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.ytdl-bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .3s ease}
.ytdl-bar.busy span{width:35%;position:absolute;animation:ytdl-slide 1.2s ease-in-out infinite}
.ytdl-bar.ok span{background:#5ccf8a}
.ytdl-bar.bad span{background:#ff6b6b}
@keyframes ytdl-slide{from{left:-35%}to{left:100%}}
.ytdl-meta{display:flex;justify-content:space-between;gap:10px;min-height:1.3em}
.ytdl-meta span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ytdl-log summary{cursor:pointer;font-size:13px;color:var(--muted)}
.ytdl-log pre{margin:8px 0 0;max-height:160px;overflow:auto;padding:10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.ytdl-bar.busy span{animation:none;width:100%;opacity:.5}}
.ytp-play{flex:none;margin-left:auto}
.src-results{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:12px;max-height:50vh;overflow-y:auto;overflow-x:hidden}
.src-row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;background:rgba(255,255,255,.04);min-width:0}
.src-row img,.src-row .ver-ph{width:48px;height:48px;border-radius:6px;object-fit:cover;flex:none}
.src-meta{flex:1;min-width:0;display:flex;flex-direction:column}
.src-meta b,.src-meta .small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-lic a{color:inherit}
.src-add{flex:none}
.src-set{padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.admin-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;padding:10px 14px;border-radius:12px;background:rgba(255,176,112,.12);border:1px solid rgba(255,176,112,.35)}
.admin-banner svg{width:18px;height:18px;color:var(--accent);flex:none}
.admin-banner span{flex:1;min-width:200px}
.admin-plays{margin:0 0 18px;padding-left:22px;display:grid;gap:4px}
.srv-list{display:grid;gap:8px;margin:0 0 6px}
.srv-pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:inherit;font:inherit;cursor:pointer}
.srv-pick:hover{background:rgba(255,255,255,.08)}
.srv-pick.on{border-color:var(--accent)}
.srv-pick b{display:block}
.srv-dot{flex:none;width:10px;height:10px;border-radius:50%;background:#7a6f86}
.srv-dot.ok{background:#3ecf6e}
.srv-or{margin:10px 0 0}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline}
.gate h1{font:800 clamp(28px,6vw,36px)/1.05 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.gate-sub{color:var(--muted);margin:6px 0 18px;max-width:46ch}
.gate-form{display:flex;flex-direction:column;gap:14px}
.gate-ok{padding:13px 20px;font-size:15px}
.gate-ok:disabled{opacity:.6}
.gate-alt{justify-content:center;padding:12px}
.gate-err{margin:0;color:#ff9a9a;font-size:14px}
.gate-notyou{align-self:flex-start;margin-top:-6px;font-size:14px}
.gate-srv{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.gate-col{width:min(400px,100%);display:flex;flex-direction:column;gap:28px}
.gate-apps{border-top:1px solid rgba(255,255,255,.1);padding-top:20px}
.gate-apps h2{font:700 17px var(--font-display);margin:0 0 12px}
.gd-tabs{display:flex;gap:6px;margin:0 0 12px}
.gd-tab{flex:1;padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:transparent;color:inherit;font:inherit;font-size:14px;cursor:pointer}
.gd-tab.on{background:var(--accent);border-color:var(--accent);color:#1b1522;font-weight:600}
.gd-panel .steps{margin:0 0 10px;padding-left:20px;display:grid;gap:6px}
.gd-panel .steps svg{width:15px;height:15px;vertical-align:-2px}
.gd-panel p{margin:0 0 12px}
.gd-btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;width:100%;margin:0 0 12px;text-decoration:none}
.gd-btn svg{width:18px;height:18px}
.pin{letter-spacing:.6em;font-size:22px!important;font-variant-numeric:tabular-nums;text-align:center;max-width:12rem}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent);color:var(--accent-ink);font:800 15px var(--font-display)}
.acct-btn:hover{filter:brightness(1.08)}
.acct-actions{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.apps-box{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.app-links{display:flex;flex-direction:column;gap:6px}
.app-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--raise);color:var(--fg);text-decoration:none}
.app-link:hover{background:var(--hover)}
.app-link>svg{color:var(--accent);width:20px;height:20px}
.app-link>span{display:flex;flex-direction:column;min-width:0}
.apps-box>a.small{color:var(--accent)}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.person-add{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;padding:16px;margin:18px 0 22px;background:var(--raise);border-radius:12px}
.person-add .field{min-width:0}
.person-add .field input{width:min(16rem,100%)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.people{display:flex;flex-direction:column;gap:12px}
.person{background:var(--raise);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.person-head{display:flex;align-items:center;gap:12px}
.person-meta{min-width:0;display:flex;flex-direction:column}
.person-meta h3{margin:0;font:700 18px var(--font-display)}
.person-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.text-btn.danger{color:#ff8e8e;border-color:color-mix(in srgb,#ff8e8e 50%,transparent)}
.devices{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.device{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.device>div{display:flex;flex-direction:column;min-width:0}

/* ---------- YouTube ---------- */
.yt-box{position:fixed;right:16px;bottom:100px;z-index:45;width:min(356px,calc(100vw - 32px));background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.55)}
.yt-frame{aspect-ratio:16/9;width:100%}
.yt-frame iframe{width:100%;height:100%;display:block;border:0}
.yt-bar{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--raise);cursor:grab;touch-action:none;user-select:none}
/* In the bar: the video fills the cover-art spot. Clicks go through to the cover (open the full player). */
/* Big view: the video fills the cover-art spot in the full-screen player. */
.yt-box.docked{position:fixed;border:0;box-shadow:0 22px 56px rgba(0,0,0,.55);z-index:41}
.yt-box.docked .yt-frame{width:100%;height:100%;aspect-ratio:auto;overflow:hidden;position:relative}
.yt-box.docked .yt-frame iframe{position:absolute;top:0;left:50%;width:177.78%;height:100%;transform:translateX(-50%)}
/* Everywhere else: the player keeps a normal size so it plays, but it isn't shown. */
.yt-box.audio-only{left:0!important;right:auto!important;top:auto!important;bottom:0!important;width:320px;opacity:0;pointer-events:none;z-index:-1;clip-path:inset(50%);border:0;box-shadow:none}
.yt-box .yt-bar{display:none}
.video-switch{display:flex;align-self:center;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.video-switch button{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.video-switch button.on{background:var(--fg);color:var(--bg)}
/* Spotify imports */
.row.ghost .ti img{filter:grayscale(1);opacity:.5}
.row.ghost .t,.row.ghost .a>button,.row.ghost .alb,.row.ghost .dur{opacity:.55}
.row.ghost:hover .t{opacity:.85}
.sp-chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:1px;border:1px solid var(--line);color:var(--muted)}
.sp-chip.in{border-color:transparent;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.sp-chip.yt{border-color:transparent;background:color-mix(in srgb,#e0473f 22%,transparent);color:#ff8f88}
.sp-chip.none{border-color:color-mix(in srgb,#ff8e8e 40%,transparent);color:#ff9a9a}
.sp-av{background:#2fa36b;color:#fff}
.disc-badge{background:#5d8bf4}
.sp-av svg{width:16px;height:16px}
.ver-list{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto;margin:0 -4px}
.ver{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;cursor:pointer;color:var(--fg)}
.ver:hover{background:var(--hover)}
.ver input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.ver img,.ver-ph{width:48px;height:48px;border-radius:4px;object-fit:cover;flex:none}
.ver-ph{display:grid;place-items:center;background:linear-gradient(140deg,#5b35c9,#ffb070);color:#fff}
.ver-ph svg{width:20px;height:20px}
.ver>span:last-child{display:flex;flex-direction:column;min-width:0}
.ver b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps code{font-size:12px;background:var(--bg);padding:1px 6px;border-radius:4px;user-select:all;word-break:break-all}
.yt-bar a,.steps a{color:var(--accent)}
.yt-badge{position:absolute;left:8px;top:8px;background:#e0473f;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.02em}
.yt-setup{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:28px;padding:16px;background:var(--raise);border-radius:12px}
.yt-setup>span{color:#e0473f}
.yt-setup>div{flex:1;min-width:14rem}
.yt-setup p{margin:4px 0 0}
.yt-search-row{display:flex;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap}
.yt-av{background:#e0473f;color:#fff}
.yt-av svg{width:16px;height:16px}
.yt-key-form{margin:0}
.yt-key-form .field input{width:min(26rem,100%)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.sub-head{font:700 20px var(--font-display);margin:30px 0 6px}
.yt-settings{margin:12px 0 4px}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;z-index:90;background:rgba(8,5,12,.62);display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal h2{font:800 22px/1.2 var(--font-display);margin:0 0 10px;text-wrap:balance;overflow-wrap:anywhere}
.m-body{color:var(--muted);display:flex;flex-direction:column;gap:12px;font-size:14px}
.m-body p{margin:0}
.m-body b{color:var(--fg)}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field textarea{resize:vertical;min-height:4.5em;line-height:1.4}
.field input,.field textarea{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:15px;padding:10px 12px}
.field input:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.m-ok{padding:9px 20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.m-ok.danger{background:#ff8e8e;color:#2a0707}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .app,.app.np-on{grid-template-columns:240px minmax(0,1fr)}
  .np-panel{display:none!important}
  #npBtn{display:none}
}
@media (max-width:760px){
  .app,.app.np-on{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;padding:0;gap:0}
  .sidebar{display:none}
  .main{grid-column:1;border-radius:0;background:var(--bg)}
  .topbar{padding:10px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent)}
  .m-brand{display:flex}
  .view{padding:4px 16px 24px}
  .hero{flex-direction:column;align-items:stretch;margin:-4px -16px 0;padding:20px 16px}
  .hero-cover{width:min(230px,64%);align-self:center}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qt{font-size:13px;gap:8px;padding-right:6px}

function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

}
const curId = () => state.list[state.order[state.pos]];
function playFrom(type, id, start) {
  const col = getCollection(type, id); if (!col || !col.tracks.length) return;
  state.ctx = { type, id, title: col.title };
  state.list = col.tracks.slice();
  if (start == null) start = state.shuffle ? Math.floor(Math.random() * state.list.length) : 0;
  buildOrder(clamp(start, 0, state.list.length - 1));

}
let spFails = 0;
function loadAndPlay(tid, autoplay = true) {
  state.current = tid;

  if (st && st.sp) {
    // Imported Spotify song: play your uploaded copy, or its YouTube match.
    Engine.pause(); updatePlayerUI();
    resolveSp(st).then(p => {
      if (state.current !== tid) return;
      if (!p) { if (autoplay && ++spFails < 5) setTimeout(() => next(true), 400); return; }
      spFails = 0;

      if (state.resumeAt) { Engine.seek(state.resumeAt); state.resumeAt = 0; }   // resuming where you left off
      if (autoplay) { Engine.play(); notePlay(tid); }
      updatePlayIcons(); highlight(); renderNP();

  updatePlayerUI();

}

/* ================= taste & YouTube suggestions ================= */
function notePlay(id) {
  const plays = store.get('plays', {});
  plays[id] = (plays[id] || 0) + 1;
  store.set('plays', plays);
  noteYtPlay(id);
}
const genreOf = t => (t.genreTag || (GENRES[t.genre] && GENRES[t.genre].label) || '').trim();
/* Weigh what you like: liked songs count most, then songs you play. Returns the top genres and artists. */
function tasteSeeds() {
  const w = new Map(), add = (k, n) => { if (k) w.set(k, (w.get(k) || 0) + n); };
  const plays = store.get('plays', {});
  const weigh = (id, n) => {
    const t = TRACKS[id]; if (!t || !visible(id)) return;
    const g = genreOf(t); if (g) add('g:' + g, n);
    if ((t.src || t.yt) && t.artist && !/^(unknown artist|youtube)$/i.test(t.artist)) add('a:' + t.artist, n * 0.8);
  };
  state.liked.forEach(id => weigh(id, 3));
  Object.entries(plays).forEach(([id, n]) => weigh(id, Math.min(n, 5)));
  UPLOADS.trackIds.forEach(id => weigh(id, 0.5));
  const ranked = [...w.entries()].sort((a, b) => b[1] - a[1]);
  const genres = ranked.filter(([k]) => k.startsWith('g:')).slice(0, 3).map(([k]) => k.slice(2));
  const artists = ranked.filter(([k]) => k.startsWith('a:')).slice(0, 2).map(([k]) => k.slice(2));
  const guessed = !genres.length;
  if (guessed) genres.push('Hip-Hop', 'Pop', 'R&B');

}
const ytQueryFor = s => s.kind === 'genre' ? `${s.value} music` : `songs like ${s.value}`;
async function ytSearch(q, genreTag) {

  // Results are kept for 12 hours on this device to save YouTube's daily quota.
  const cached = store.get('yt:' + q, null);
  if (cached && Date.now() - cached.at < 12 * 3600e3) return cached.items.map(v => addYtTrack(v, genreTag));
  const res = await api('GET', 'api/youtube/search?q=' + encodeURIComponent(q));
  try { store.set('yt:' + q, { at: Date.now(), items: res.items }); } catch (e) {}
  return res.items.map(v => addYtTrack(v, genreTag));
}
async function loadSuggestions() {
  if (!server.on) return;
  const { genres, guessed } = tasteSeeds();
  yt.shelves = genres.slice(0, 3).map(g => ({ kind: 'genre', value: g, guessed }));
  await Promise.all(yt.shelves.map(async sh => {
    const key = 'genre:' + sh.value.toLowerCase();
    try {
      const cached = store.get('cat:' + key, null);
      let items;
      if (cached && Date.now() - cached.at < 24 * 3600e3) items = cached.items;
      else {
        items = (await api('GET', 'api/catalog/genre?name=' + encodeURIComponent(sh.value))).items || [];
        try { store.set('cat:' + key, { at: Date.now(), items }); } catch (e) {}

}

/* ================= render & update ================= */
function render() {

  if (v.name === 'home') el.innerHTML = viewHome();
  else if (v.name === 'search') el.innerHTML = viewSearch();
  else if (v.name === 'library') el.innerHTML = viewLibrary();
  else if (v.name === 'queue') el.innerHTML = viewQueue();
  else if (v.name === 'people') el.innerHTML = viewPeople();
  else if (v.name === 'member') el.innerHTML = viewMember(v.id);
  else if (v.name === 'sources') el.innerHTML = viewMySources();
  else if (v.name === 'collection') el.innerHTML = viewCollection(v.type, v.id);
  if (server.offlineMode) {
    el.insertAdjacentHTML('afterbegin', `<div class="offline-banner" role="status">${icon('cloudOff')}<span><b>Offline.</b> Can’t reach your Murmur server, so only downloaded songs can play.</span><button class="text-btn" data-act="retry">Try again</button></div>`);
  }
  syncDownloads();
  $$('[data-act="nav"]').forEach(b => b.classList.toggle('on', b.dataset.to === v.name));
  $('#backBtn').disabled = hist.i <= 0; $('#fwdBtn').disabled = hist.i >= hist.top;
  renderSidebar(); highlight(); updateToggles(); syncSel();
}
function renderSidebar() {
  $('#libChips').innerHTML = chipsHTML();

}
/* Each page gets its own address (#/album/…, #/search/…), so the browser's Back and Forward move between
   pages and a refresh opens the same page, scrolled to the same spot. */
const hist = { i: 0, top: 0 };
try { hist.top = +sessionStorage.getItem('murmur:histTop') || 0; } catch (e) {}
function viewHash(v) {
  if (!v || v.name === 'home') return location.pathname + location.search;
  if (v.name === 'collection') return '#/' + v.type + '/' + encodeURIComponent(v.id);
  if (v.name === 'member') return '#/member/' + encodeURIComponent(v.id);
  if (v.name === 'search') return '#/search' + (state.search ? '/' + encodeURIComponent(state.search) : '');
  return '#/' + v.name;
}
function viewFromHash() {
  const p = location.hash.replace(/^#\/?/, '').split('/');
  const name = p[0], rest = p.slice(1).join('/');
  let arg = ''; try { arg = decodeURIComponent(rest); } catch (e) { arg = rest; }
  if (name === 'search') return { view: { name: 'search' }, q: arg };
  if (['library', 'queue', 'people', 'sources'].includes(name)) return { view: { name } };
  if (name === 'member' && arg) return { view: { name: 'member', id: arg } };
  if (name === 'mlist' && arg) return { view: { name: 'member', id: arg.split('~')[0] } };   // reopen their library after a refresh
  if (name && rest) {
    const v = { name: 'collection', type: name, id: arg };
    if (getCollection(v.type, v.id)) return { view: v };
  }
  return { view: { name: 'home' } };
}
function histSave(extra) {
  const st = Object.assign({}, history.state || {}, { murmurView: state.view, i: hist.i, search: state.search || '' }, extra || {});
  try { history.replaceState(st, '', viewHash(state.view)); } catch (e) {}
}
function setHistTop(n) { hist.top = n; try { sessionStorage.setItem('murmur:histTop', String(n)); } catch (e) {} }
function navigate(view, push = true) {
  closeMenu(); $('#full').hidden = true;
  state.sel = null; state.libSel = null;
  if (push) histSave({ scroll: $('#main').scrollTop });   // remember where you were on the page you're leaving
  state.view = view;
  if (push) {
    hist.i++; setHistTop(hist.i);
    try { history.pushState({ murmurView: view, i: hist.i, search: state.search || '', scroll: 0 }, '', viewHash(view)); } catch (e) {}
  }
  render(); $('#main').scrollTop = 0;
  if (view.name === 'search') { const q = $('#tq'); if (q && document.activeElement !== q) q.focus(); }
}
function refreshQueueView() { if (state.view.name === 'queue') render(); }

function highlight() {
  $$('.row[data-tid]').forEach(r => {
    const cur = r.dataset.tid === state.current;
    r.classList.toggle('is-current', cur); r.classList.toggle('is-playing', cur && Engine.playing);
  });
  $$('[data-col-key]').forEach(el => el.classList.toggle('playing', !!state.ctx && el.dataset.colKey === state.ctx.type + ':' + state.ctx.id));
  $$('[data-act="play-col"]').forEach(b => {
    const on = sameCtx(b.dataset.type, b.dataset.id) && Engine.playing;
    if (b.classList.contains('on') !== on || !b.dataset.ready) {
      b.classList.toggle('on', on); b.innerHTML = icon(on ? 'pause' : 'play'); b.setAttribute('aria-label', on ? 'Pause' : 'Play'); b.dataset.ready = 1;
    }

}

  $$('[data-play-icon]').forEach(b => { b.innerHTML = icon(Engine.playing ? 'pause' : 'play'); b.setAttribute('aria-label', Engine.playing ? 'Pause' : 'Play'); });

/* Android app: tell it what's playing so it can keep music going in the background
   and show the notification with play/pause/next buttons. */
let lastAppState = '';
function notifyApp() {
  const app = window.MurmurAndroid;
  if (!app || typeof app.setPlaying !== 'function') return;
  const t = TRACKS[state.current];
  const now = [!!Engine.playing, t ? t.title : '', t ? t.artist : ''].join('|');
  if (now === lastAppState) return;
  lastAppState = now;
  try { app.setPlaying(!!Engine.playing, t ? t.title : '', t ? t.artist : ''); } catch (e) {}
}
/* Notification, lock-screen and headphone buttons call this. */
window.murmurControl = action => {
  if (action === 'toggle') togglePlay();
  else if (action === 'play') { if (!Engine.playing) togglePlay(); }
  else if (action === 'pause') { if (Engine.playing) togglePlay(); }
  else if (action === 'next') next(false);
  else if (action === 'prev') prev();
};
function updateToggles() {

  $$('[data-act="repeat"]').forEach(b => {
    b.classList.toggle('on', state.repeat !== 'off'); b.classList.toggle('rep-one', state.repeat === 'one');
    b.setAttribute('aria-label', state.repeat === 'off' ? 'Repeat: off' : state.repeat === 'all' ? 'Repeat: all' : 'Repeat: one song');
  });

  if (d.demoAlb || d.curPl) lines.push(`<p><b>${[d.demoAlb ? plural(d.demoAlb, 'demo album') : '', d.curPl ? plural(d.curPl, 'Murmur playlist') : ''].filter(Boolean).join(' and ')}</b> will be removed from your library. You can restore ${d.demoAlb + d.curPl > 1 ? 'them' : 'it'} from Your Library.</p>`);
  let name = plural(keys.length, 'item');

async function deleteCollections(keys) {
  const trackIds = [];
  let msg = [];
  keys.forEach(k => {
    const i = k.indexOf(':'), type = k.slice(0, i), id = k.slice(i + 1);
    if (type === 'import') {
      sp.imports = sp.imports.filter(x => x.id !== id);
      api('DELETE', 'api/imports/' + encodeURIComponent(id)).catch(e => toast(e.message));
      hydrateImports();
    } else if (type === 'playlist') {
      if (state.playlists.some(p => p.id === id)) {
        state.playlists = state.playlists.filter(p => p.id !== id);
        state.recent = state.recent.filter(r => r !== k);
      } else state.hiddenCols.add(id);
    } else if (type === 'album') {
      const a = ALBUM_MAP[id]; if (a) trackIds.push(...a.trackIds.filter(visible));
    }
  });
  savePlaylists(); store.set('recent', state.recent); store.set('hiddenCols', [...state.hiddenCols]);
  state.back = state.back.filter(v => !(v.name === 'collection' && keys.includes(v.type + ':' + v.id)));
  state.fwd = [];
  if (trackIds.length) { const ok = await removeTracks(trackIds); if (!ok) { render(); return; } }
  state.libSel = null; state.sel = null;
  if (state.view.name === 'collection' && !getCollection(state.view.type, state.view.id)) state.view = { name: 'home' };
  render();
  toast(keys.length > 1 ? `Done · ${plural(keys.length, 'item')} removed` : 'Done');
}
function openEdit(tids, o = {}) {

  const f = (name, label, val, ph) => `<div class="field"><label for="ed-${name}">${label}</label><input id="ed-${name}" name="${name}" value="${esc(val || '')}" placeholder="${esc(ph || '')}" autocomplete="off" maxlength="200"></div>`;
  let html, title;
  if (one) {
    title = 'Edit details';
    html = f('title', 'Title', one.title) + f('artist', 'Artist', one.artist === 'Unknown artist' ? '' : one.artist, 'Unknown artist') + f('album', 'Album', one.albumTag, 'No album (stays in Uploads)');
  } else if (o.album) {
    const a = ALBUM_MAP[o.album];
    title = 'Edit album';
    html = `<p>Changes apply to all ${plural(ts.length, 'song')} on this album.</p>` + f('album', 'Album name', a.title) + f('artist', 'Artist', a.artist === 'Various artists' ? '' : a.artist, 'Keep each song’s artist');
  } else {
    title = `Edit ${plural(ts.length, 'song')}`;
    html = `<p>Changes apply to all ${plural(ts.length, 'song')}. Leave a field blank to keep what each song has now. Giving them the same album name groups them into one album.</p>` + f('artist', 'Artist', '', 'Keep current') + f('album', 'Album', '', 'Keep current');
  }
  openModal({ title, html, confirm: 'Save', onSubmit: async fd => {
    const body = { ids: ts.map(t => t.sid) };
    if (one) { body.title = fd.get('title'); body.artist = fd.get('artist'); body.album = fd.get('album'); }
    else {
      const ar = String(fd.get('artist') || '').trim(), al = String(fd.get('album') || '').trim();
      if (ar) body.artist = ar; if (al) body.album = al;
      if (!ar && !al) return;
    }
    let res;
    try { res = await api('PATCH', 'api/tracks', body); } catch (e) { toast(e.message); return; }
    res.tracks.forEach(addServerTrack);
    res.tracks.forEach(r => {   // keep the offline copy's details in step

      if (offline.has(id)) Offline.get(id).then(rec => rec && Offline.put({ ...rec, meta: r })).catch(() => {});
    });

      state.view = { name: 'collection', type: 'album', id: TRACKS['f-' + res.tracks[0].id].albumId };
    }
    state.sel = null; render(); updatePlayerUI();
    toast(res.tracks.length > 1 ? `Saved ${plural(res.tracks.length, 'song')}` : 'Saved');

function act(el, e) {
  const d = el.dataset;
  switch (d.act) {
    case 'nav': navigate({ name: d.to }); break;
    case 'logo-home': {
      state.search = ''; const q = $('#tq'); if (q) { q.value = ''; const c = $('#tqClear'); if (c) c.hidden = true; }

    case 'open':
      if (!d.id) return;
      navigate({ name: 'collection', type: d.type, id: d.id }); break;
    case 'play-col':
      if (sameCtx(d.type, d.id)) togglePlay(); else playFrom(d.type, d.id, null);

    case 'play-track': {
      const list = el.closest('[data-ctx-type]'); if (!list) return;
      const type = list.dataset.ctxType, id = list.dataset.ctxId, i = +d.i;
      if (selMatches(type, id)) { toggleSel(i, e.shiftKey); return; }
      if (e.ctrlKey || e.metaKey || e.shiftKey) { startSel(type, id, i); return; }
      if (d.tid === state.current && sameCtx(type, id)) togglePlay(); else playFrom(type, id, i);
      break;
    }
    case 'toggle': togglePlay(); break;
    case 'next': case 'next-now': next(false); break;
    case 'prev': prev(); break;
    case 'shuffle':
      state.shuffle = !state.shuffle; store.set('shuffle', state.shuffle);

    case 'repeat':
      state.repeat = { off: 'all', all: 'one', one: 'off' }[state.repeat]; store.set('repeat', state.repeat);

    case 'like': toggleLike(d.tid); break;

    /* account & people */

const sp = { clientId: '', fullLinks: false, imports: [], matches: {}, token: null };
const SP_SCOPES = 'playlist-read-private playlist-read-collaborative user-library-read';
const SPALBUM = { id: 'spotify', title: 'From Spotify', artist: 'Spotify', year: 'Imported', genre: 'spotify', seed: 11,
  colors: ['#2fa36b', '#12261c', '#ffb070'], desc: 'Every song from your imported Spotify playlists.', trackIds: [] };

const spRedirect = () => location.origin + location.pathname;

function addSpTrack(x, source = 'spotify') {
  const id = 'sp-' + hashStr(x.key).toString(36) + hashStr('m' + x.key).toString(36);
  if (TRACKS[id] && !(TRACKS[id].disc && source === 'spotify')) return id;   // an imported copy wins over a suggestion
  const isDisc = source === 'discover';
  TRACKS[id] = { id, sp: true, disc: isDisc, key: x.key, title: x.title, artist: x.artist || 'Unknown artist', album: x.album || (isDisc ? 'Discover' : 'Spotify'),
    albumId: isDisc ? 'discover' : 'spotify', genre: isDisc ? 'discover' : 'spotify', duration: x.duration || 0, cover: x.cover || (isDisc ? DISCALBUM.cover : SPALBUM.cover),
    isrc: x.isrc, url: x.url, because: x.because || '', seed: hashStr(id) };

}
function hydrateImports() {

/* 'file' = your copy is in Murmur, 'yt' = plays from YouTube, 'none' = nothing found, 'new' = not looked up yet */
function spStatus(id) {
  const t = TRACKS[id]; if (!t || !t.sp) return '';
  const m = sp.matches[t.key] || {};
  if (m.file && TRACKS['f-' + m.file]) return 'file';
  if (m.yt) return 'yt';
  return m.none ? 'none' : 'new';
}
const SP_CHIP = { file: ['In Murmur', 'in'], yt: ['YouTube', 'yt'], none: ['Not found', 'none'], new: ['Not in Murmur', 'new'] };
function spChip(id) { const s = spStatus(id); return s ? `<span class="sp-chip ${SP_CHIP[s][1]}">${SP_CHIP[s][0]}</span>` : ''; }
async function saveMatch(key, patch) {
  try { const res = await api('PUT', 'api/matches/' + encodeURIComponent(key), patch); sp.matches[key] = res.match; }
  catch (e) { toast(e.message); }
}
/* Pick the YouTube result that's most likely the same recording. */
function pickBest(t, ids) {
  const artist = normKey(t.artist.split(',')[0]), title = normKey(t.title);
  const bad = /\b(live|cover|karaoke|instrumental|remix|sped up|slowed|8d|reaction|nightcore|reverb)\b/;
  let best = null, top = -Infinity;
  ids.forEach(id => {
    const v = TRACKS[id]; if (!v) return;
    const vt = normKey(v.title), ch = normKey(v.artist);
    let s = 0;
    const dd = Math.abs((v.duration || 0) - (t.duration || 0));
    s -= t.duration ? (dd > 25 ? 60 : dd) : 0;
    if (artist && (ch.includes(artist) || artist.includes(ch) || vt.includes(artist))) s += 30;
    if (title && vt.includes(title)) s += 25;
    if (bad.test(vt) && !bad.test(title)) s -= 45;
    if (s > top) { top = s; best = id; }
  });
  return top > -45 ? best : null;
}
/* Turn an imported song into something the engine can play. */
async function resolveSp(t) {
  const m = sp.matches[t.key] || {};
  if (m.file && TRACKS['f-' + m.file]) return TRACKS['f-' + m.file];
  if (m.yt) return TRACKS[addYtTrack(m.yt)];
  if (!server.on || !yt.enabled) { toast('This song isn’t in Murmur yet. Connect YouTube in People & settings to play it, or use ⋯ → Bring into Murmur.'); return null; }
  let ids;
  try { ids = await ytSearch(`${t.artist.split(',')[0]} - ${t.title}`, ''); } catch (e) { toast(e.message); return null; }
  const best = pickBest(t, ids);
  await saveMatch(t.key, best ? { yt: ytMeta(best) } : { none: true });
  syncSpChips();
  return best ? TRACKS[best] : null;
}
function syncSpChips() {
  $$('.row[data-tid^="sp-"]').forEach(r => {

    r.classList.toggle('ghost', s !== 'file');
    const chip = r.querySelector('.sp-chip'); if (chip) { chip.className = 'sp-chip ' + SP_CHIP[s][1]; chip.textContent = SP_CHIP[s][0]; }
  });
}

/* ---------- Spotify sign-in (PKCE, in the browser) ---------- */
async function spLogin() {
  if (!sp.clientId) { toast('Spotify isn’t set up yet. The owner can add it under People & settings.'); return; }
  if (!window.crypto || !crypto.subtle) { toast('Importing needs a secure address. Open Murmur from your https:// address or http://127.0.0.1:8080.'); return; }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
  const st = b64url(crypto.getRandomValues(new Uint8Array(12)));
  sessionStorage.setItem('murmur:spauth', JSON.stringify({ verifier, state: st }));
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({ response_type: 'code', client_id: sp.clientId,
    scope: SP_SCOPES, redirect_uri: spRedirect(), code_challenge_method: 'S256', code_challenge: challenge, state: st });
}
function spSaveToken(j) {
  sp.token = { access: j.access_token, refresh: j.refresh_token || (sp.token && sp.token.refresh), exp: Date.now() + ((j.expires_in || 3600) - 60) * 1000 };
  try { sessionStorage.setItem('murmur:sptok', JSON.stringify(sp.token)); } catch (e) {}
}
async function spFinishLogin() {
  const p = new URLSearchParams(location.search);
  if (!p.has('state') || (!p.has('code') && !p.has('error'))) return false;
  history.replaceState(history.state, '', spRedirect());
  let saved = null; try { saved = JSON.parse(sessionStorage.getItem('murmur:spauth') || 'null'); } catch (e) {}
  sessionStorage.removeItem('murmur:spauth');
  if (p.get('error')) { toast(p.get('error') === 'access_denied' ? 'Spotify sign-in was cancelled.' : 'Spotify said: ' + p.get('error')); return true; }
  if (!saved || saved.state !== p.get('state')) { toast('That Spotify sign-in didn’t match. Try importing again.'); return true; }
  const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'authorization_code', code: p.get('code'), redirect_uri: spRedirect(), client_id: sp.clientId, code_verifier: saved.verifier }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast('Spotify sign-in failed: ' + (j.error_description || j.error || r.status)); return true; }
  spSaveToken(j);
  openImportPicker();
  return true;
}
async function spAccess() {
  if (!sp.token) { try { sp.token = JSON.parse(sessionStorage.getItem('murmur:sptok') || 'null'); } catch (e) {} }
  if (!sp.token) return null;
  if (Date.now() < sp.token.exp) return sp.token.access;
  if (!sp.token.refresh) return null;
  const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: sp.token.refresh, client_id: sp.clientId }) });
  if (!r.ok) { sp.token = null; sessionStorage.removeItem('murmur:sptok'); return null; }
  spSaveToken(await r.json());
  return sp.token.access;
}
async function spGet(url) {
  const tok = await spAccess();
  if (!tok) throw Object.assign(new Error('Sign in to Spotify again.'), { login: true });
  for (let tries = 0; tries < 5; tries++) {
    const r = await fetch(url.startsWith('http') ? url : 'https://api.spotify.com/v1/' + url, { headers: { Authorization: 'Bearer ' + tok } });
    if (r.status === 429) { await new Promise(res => setTimeout(res, (Number(r.headers.get('Retry-After')) || 2) * 1000)); continue; }
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { sp.token = null; sessionStorage.removeItem('murmur:sptok'); throw Object.assign(new Error('Sign in to Spotify again.'), { login: true }); }
    if (r.status === 403) throw new Error((j.error && j.error.message) || 'Spotify didn’t allow this. Make sure your Spotify account is added under User Management in the Spotify app settings.');
    if (!r.ok) throw Object.assign(new Error((j.error && j.error.message) || `Spotify answered ${r.status}.`), { status: r.status });
    return j;
  }
  throw new Error('Spotify is busy. Try again in a minute.');
}
async function spTracks(id) {
  const out = [];
  let url = id === 'liked' ? 'me/tracks?limit=50' : `playlists/${id}/tracks?limit=100`;
  let triedItems = false;
  while (url) {
    let j;
    try { j = await spGet(url); }
    catch (e) {
      // Newer Spotify apps read playlist songs from /items instead of /tracks.
      if (!e.login && id !== 'liked' && !triedItems && !out.length) { triedItems = true; url = `playlists/${id}/items?limit=100`; continue; }
      throw e;
    }
    (j.items || []).forEach(it => {
      const tr = it && (it.track || it.item);
      if (!tr || (tr.type && tr.type !== 'track') || !tr.name) return;
      const imgs = (tr.album && tr.album.images) || [];
      const x = { title: tr.name, artist: (tr.artists || []).map(a => a.name).filter(Boolean).join(', '), album: (tr.album && tr.album.name) || '',

        isrc: (tr.external_ids && tr.external_ids.isrc) || '', url: (tr.external_urls && tr.external_urls.spotify) || '' };
      x.key = matchKey({ isrc: x.isrc, artist: x.artist.split(',')[0], title: x.title });

async function importPlaylists(ids, lists) {
  if (!ids.length) return;
  let done = 0, firstId = null;
  for (const sid of ids) {
    const meta = sid === 'liked' ? { name: 'Liked Songs (Spotify)', images: [] } : lists.find(l => l.id === sid) || { name: 'Spotify playlist', images: [] };
    server.current = { name: `${meta.name} (${done + 1} of ${ids.length})`, pct: 5 }; renderUploadStatus();
    sp.progress = n => { server.current.name = `${meta.name}: ${n} songs`; renderUploadStatus(); };
    try {
      const tracks = await spTracks(sid);
      const id = 'spi-' + sid;
      const res = await api('PUT', 'api/imports/' + encodeURIComponent(id), { spotifyId: sid, name: meta.name, cover: ((meta.images || [])[0] || {}).url || '', owner: meta.owner && meta.owner.display_name, tracks });
      sp.imports = [res.import, ...sp.imports.filter(i => i.id !== id)];

    } catch (e) {

      toast(`${meta.name}: ${e.status === 404 ? 'Spotify doesn’t let apps read this playlist (Spotify-made playlists like Discover Weekly are blocked).' : e.message}`);
    }
  }
  sp.progress = null; server.current = null; renderUploadStatus();
  hydrateImports();
  if (done) { toast(`Imported ${plural(done, 'playlist')} from Spotify`); navigate({ name: 'collection', type: 'import', id: firstId }); }

/* Imports each link in turn, then says how it went. */
async function importMany(links) {

    server.current = { name: links.length > 1 ? `Importing ${i + 1} of ${links.length} from Spotify…` : 'Reading the playlist from Spotify…', pct: Math.round(i / links.length * 100) || 5 };
    renderUploadStatus();
    try { const r = await importOneLink(link); firstId = firstId || r.id; ok++; if (r.partial) fails.push(`“${r.name}”: only the first ${r.count} of ${r.total} songs`); }
    catch (e) { fails.push(e.message); }

  server.current = null; renderUploadStatus();
  hydrateImports();
  if (!ok) { openLinkImport(fails[0] || 'Couldn’t import that.', links.join('\n')); return; }
  toast(ok === 1 && links.length === 1 ? `Imported “${sp.imports.find(x => x.id === firstId).name}”` : `Imported ${plural(ok, 'playlist')} from Spotify${fails.length ? ` (${plural(fails.length, 'problem')})` : ''}`);

}
async function importOneLink(link) {

    async function getManyFromYouTube(ids) {
        const todo = ids.map(id => TRACKS[id]).filter(t => t && !t.src);
        if (!todo.length) { toast('Those songs are already in your library.'); return; }
        const dl = ytProgress({ title: `Getting ${plural(todo.length, 'song')} from YouTube` });

            if (t.yt) { links.push(`https://www.youtube.com/watch?v=${t.ytId}`); dl.log(`Using "${t.title}"`); continue; }
            let best;
            try { best = await bestYouTubeFor(t); }
            catch (e) { dl.log(`Couldn't search for "${t.title}": ${e.message}`); continue; }
            if (best) { links.push(`https://www.youtube.com/watch?v=${best.ytId}`); dl.log(`"${t.title}" → ${best.title} (${best.artist})`); }

    /* Scores a YouTube result (y) as a copy of song t: the original artist's channel (best of all their
       auto-made "Artist - Topic" one), the right title and length, and no live / music video / remix / cover
       extras unless the song's own title has them. */
    const ytNorm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
        .replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim();
    const ytCompact = s => ytNorm(s).replace(/ /g, '');
    const YT_EXTRAS = ['live', 'concert', 'tour', 'performance', 'session', 'sessions', 'music video', 'official video', 'video oficial',
        'mv', 'm v', 'cover', 'remix', 'sped up', 'slowed', 'reverb', 'nightcore', '8d', 'karaoke', 'instrumental', 'acoustic',
        'reaction', 'extended', 'loop', 'hour', 'hours', 'mashup', 'edit', 'version', 'teaser', 'trailer', 'behind the scenes',
        'dance', 'choreography', 'tutorial', 'piano', 'guitar', 'bass boosted', 'clean', 'unplugged', 'demo', 'shorts'];
    function ytScore(t, y) {
        const song = ytNorm(t.title), bare = ytNorm(String(t.title).replace(/\s*[([].*?[)\]]/g, '').replace(/\s+-\s+.*$/, ''));
        const vid = ytNorm(y.title), artist = ytCompact(cleanArtist(t.artist));
        const chan = ytNorm(y.artist), topic = / topic$/.test(chan);
        const chanC = ytCompact(chan.replace(/ topic$/, '')).replace(/(vevo|official|music|tv)$/g, '');
        let s = 0;
        if (artist && chanC === artist) s += topic ? 65 : 45;
        else if (artist && chanC.length > 2 && (chanC.includes(artist) || artist.includes(chanC))) s += 30;
        else if (artist && ytCompact(vid).includes(artist)) s -= 15;   // a re-upload that only names the artist
        else s -= 40;   // someone else's upload, probably not the original artist
        s += ytCompact(vid).includes(ytCompact(bare)) ? 25 : -30;
        for (const w of YT_EXTRAS) {
            const re = new RegExp(`(^| )${w}( |$)`);
            if (re.test(vid) && !re.test(song)) s -= 30;
        }
        if (/(^| )(official )?audio( |$)/.test(vid)) s += 15;
        if (/(^| )lyrics?( video)?( |$)/.test(vid)) s -= 5;
        if (t.duration && y.duration) {
            const off = Math.abs(t.duration - y.duration);
            s += off <= 3 ? 25 : off <= 8 ? 12 : off <= 20 ? 0 : off <= 45 ? -20 : -45;
        }
        return s;
    }
    const YT_GOOD = 40;   // at or above this, it's very likely the studio song by the right artist
    async function bestYouTubeFor(t) {
        const artist = cleanArtist(t.artist);
        const rank = ids => ids.map(id => TRACKS[id]).filter(Boolean).map(y => ({ y, s: ytScore(t, y) })).sort((a, b) => b.s - a.s);
        let ranked = rank(await ytSearch(`${artist}\n${t.title}`, ''));
        // Nothing clearly right: one more search aimed at the plain audio upload.
        if (!ranked.length || ranked[0].s < YT_GOOD) ranked = rank([...new Set([...ranked.map(r => r.y.id), ...await ytSearch(`${artist} ${t.title} official audio`, '')])]);
        return ranked.length && ranked[0].s > 0 ? ranked[0].y : null;
    }

    /* Sends YouTube links to the signed-in Murmur server and turns its yt-dlp output into the progress bar:
       each song is downloading (to 80%), converting, then saved, and finally added to the library. */
    async function streamConvert(links, dl) {
        const n = links.length;
        let done = 0, part = 0, added = 0, errors = 0, started = false, counted = false;
        const show = text => dl.stage(text, Math.min(99, (done + part) / n * 100));
        const label = () => n > 1 ? `Song ${Math.min(done + 1, n)} of ${n}` : '';
        const onLine = line => {
            dl.log(line);
            let m;
            if (/^\[youtube\] Extracting URL/.test(line)) {
                // A new song starting means the one before it is finished.
                if (started && !counted) done = Math.min(n, done + 1);
                started = true; counted = false; part = 0;
                dl.note(label()); show('Getting the video info…');
            }
            else if ((m = line.match(/^\[download\] Destination: (.+)$/))) dl.note([label(), m[1].split(/[\\/]/).pop().replace(/\.[^.]+$/, '')].filter(Boolean).join(' · '));
            else if ((m = line.match(/^\[download\]\s+([\d.]+)%/))) { part = Math.max(part, parseFloat(m[1]) / 100 * 0.8); show('Downloading…'); }
            else if (/has already been recorded in the archive/.test(line)) { done++; counted = true; part = 0; show('Already downloaded before, skipping…'); }
            else if (/^\[ExtractAudio\]/.test(line)) { part = Math.max(part, 0.85); show('Converting to MP3…'); }
            else if (/^\[(Metadata|EmbedThumbnail)\]/.test(line)) { part = Math.max(part, 0.95); show('Adding the cover and song info…'); }
            else if (/^ERROR:/.test(line)) errors++;
            else if (/^Added ".*" to Murmur$/.test(line)) {
                if (started && !counted) { done = n; counted = true; part = 0; }   // yt-dlp is through; the server is filing them
                added++; show('Adding to your library…');
            }
        };
        try {
            dl.stage('Connecting to your Murmur server…', null);
            // Local laptop testing talks to the standalone converter; otherwise the Murmur server you're signed in to.
            const local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            const res = await fetch(local ? 'http://localhost:8765/convert' : apiUrl('convert'), {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ links, format: 'mp3' })
            });
            if (!res.ok) throw new Error(res.status === 403 ? 'You don’t have permission to add music on this server.' : 'The server answered with error ' + res.status + '.');
            dl.stage('Starting…', null);
            const reader = res.body.getReader(), decoder = new TextDecoder();
            let buf = '';
            while (true) {
                const { value, done: end } = await reader.read();
                if (end) break;
                buf += decoder.decode(value, { stream: true });
                const parts = buf.split(/\r?\n/); buf = parts.pop();
                parts.forEach(l => l && onLine(l));
            }
            if (buf) onLine(buf);
            const ok = added > 0 || (!errors && done >= n);
            const msg = added ? `Added ${plural(added, 'song')} to your library${errors ? ` (${plural(errors, 'problem')}, see Details)` : ''}`
                : errors ? 'Couldn’t download that. Open Details to see why.' : 'Already in your library.';
            dl.note('');
            dl.finish(ok, msg);
            toast(msg);
            if (added) await connectServer();   // show the new songs in the library
        } catch (err) {
            dl.log('Error: ' + err.message);
            dl.finish(false, err.message || 'Download failed.');
            toast('Download failed.');
        }
    }

async function openSourceSearch(q, matchKey = '', forTid = '') {

    <p class="small">Searches ${esc(srcs.list.filter(x => x.ready).map(x => x.name).join(', ') || 'your download sources')}: songs you’re allowed to keep. Adding one puts the file in Murmur${matchKey ? ' and makes this song play from it' : ''}.</p>
    <div class="field"><label for="srcQ">Search</label><input id="srcQ" name="q" value="${esc(q)}" autocomplete="off"></div>
    <div class="src-results" id="srcResults">${body}</div>`,
    onSubmit: fd => openSourceSearch(String(fd.get('q') || '').trim(), matchKey, forTid) });
  shell('<p class="small">Searching…</p>');
  let r;

      ${x.cover ? `<img src="${esc(x.cover)}" alt="" loading="lazy">` : `<span class="ver-ph">${icon('download')}</span>`}

async function addFromSource(d) {

      onSubmit: () => addFromSource({ ...d, confirmed: '1' }) });
    return;
  }
  const btn = $(`[data-act="src-add"][data-provider="${CSS.escape(d.provider)}"][data-id="${CSS.escape(d.id)}"]`);
  if (btn) { btn.disabled = true; btn.textContent = 'Adding…'; }
  try {
    const res = await api('POST', 'api/sources/add', { provider: d.provider, id: d.id, matchKey: d.key || undefined });
    addServerTrack(res.track); rebuildUploadAlbums();
    if (d.key) { sp.matches[d.key] = { ...(sp.matches[d.key] || {}), file: res.track.id }; syncSpChips(); }

}

const DISCALBUM = { id: 'discover', title: 'Discover', artist: 'Murmur', year: 'Made for you', genre: 'discover', seed: 23,
  colors: ['#5d8bf4', '#141a33', '#ffb070'], desc: '', trackIds: [] };
DISCALBUM.cover = makeCover(DISCALBUM);
ALBUM_MAP.discover = DISCALBUM;
const disc = { ids: [], seeds: [], loading: false, error: '' };
const cleanArtist = a => String(a || '').split(',')[0].replace(/\s*-\s*topic$/i, '').replace(/vevo$/i, '').replace(/\s+official$/i, '').trim();
/* The artists you actually listen to: liked songs count most, then plays, Spotify imports and uploads. Demo artists are skipped. */
function discoverSeeds() {
  const demo = new Set(ARTISTS.map(a => a.toLowerCase())), w = new Map();
  const add = (a, n) => { a = cleanArtist(a); if (!a || demo.has(a.toLowerCase()) || /^(unknown artist|youtube|various artists|spotify)$/i.test(a)) return; w.set(a, (w.get(a) || 0) + n); };
  const weigh = (id, n) => { const t = TRACKS[id]; if (t && visible(id) && (t.src || t.yt || t.sp)) add(t.artist, n); };
  const plays = store.get('plays', {});
  state.liked.forEach(id => weigh(id, 3));
  Object.entries(plays).forEach(([id, n]) => weigh(id, Math.min(n, 5)));
  sp.imports.forEach(i => (i.trackIds || []).forEach(id => { if (!TRACKS[id].disc) weigh(id, 0.3); }));
  UPLOADS.trackIds.forEach(id => weigh(id, 0.5));
  return [...w.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([a]) => a);
}
/* Songs you already have, so suggestions are always new. */
function ownedKeys() {
  const keys = new Set();
  Object.values(TRACKS).forEach(t => { if (!t.disc) keys.add(normKey(cleanArtist(t.artist)) + '|' + normKey(t.title)); });
  return keys;
}
// Songs already suggested that you removed (and, when asking for new ones, the ones showing now): never again.
function discoverExclude(includeShown) {
  const keys = new Set();
  const add = id => { const t = TRACKS[id]; if (t && t.disc) keys.add(cleanArtist(t.artist) + '|' + t.title); };
  state.hidden.forEach(add);
  if (includeShown) disc.ids.forEach(add);
  return [...keys];
}
async function loadDiscover(force, retried) {
  if (!server.on || disc.loading) return;
  const seeds = discoverSeeds();
  const cached = store.get('discover', null);
  let items;
  if (!force && cached && Date.now() - cached.at < 24 * 3600e3 && cached.seeds.join('|') === seeds.join('|')) items = cached.items;
  else {
    disc.loading = true; if (state.view.name === 'home' || state.view.type === 'discover') render();
    try {
      const res = await api('POST', 'api/discover', { artists: seeds, exclude: discoverExclude(!!force) });
      items = res.items || [];
      try { store.set('discover', { at: Date.now(), seeds, items }); } catch (e) {}
      disc.error = '';
    } catch (e) { disc.error = e.message; items = (cached && cached.items) || []; }
    disc.loading = false;
  }
  const owned = ownedKeys();
  disc.seeds = seeds;
  disc.ids = items.filter(x => !owned.has(normKey(cleanArtist(x.artist)) + '|' + normKey(x.title)))
    .map(x => addSpTrack({ ...x, key: matchKey({ isrc: x.isrc, artist: cleanArtist(x.artist), title: x.title }) }, 'discover'));
  DISCALBUM.trackIds = disc.ids;
  if (state.view.name === 'home' || (state.view.name === 'collection' && state.view.type === 'discover')) render(); else renderSidebar();
  // Everything in the list was removed already: get a fresh batch.
  if (!retried && !disc.error && !disc.ids.some(visible)) loadDiscover(true, true);
}
