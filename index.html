  { id: 'forest', name: 'Forest', c: ['#0d1410', '#142019', '#1b2b22', '#22362b', '#2d4637', '#ecf7ee', '#9bb8a3', '#8fd16a', '#10240a'] },
  { id: 'sunset', name: 'Sunset', c: ['#1a0e12', '#24131a', '#311a23', '#3d212c', '#4c2a37', '#fff0f3', '#c79aa7', '#ff7a6b', '#2e0905'] },

  { id: 'lavender', name: 'Lavender', c: ['#15121f', '#1d1930', '#272140', '#30294f', '#3c3460', '#f3f0ff', '#ada6cf', '#b9a2ff', '#1c1236'] },
  { id: 'sakura', name: 'Sakura', c: ['#1a1016', '#24151e', '#301c28', '#3b2332', '#4a2d40', '#fff0f7', '#c9a0b6', '#ff9ecb', '#3a0a22'] },
  { id: 'gold', name: 'Gold', c: ['#0f0d08', '#1a160d', '#252014', '#302a1b', '#3f3724', '#fbf6e8', '#bdb294', '#f2c14e', '#2a1f02'] },
  { id: 'coffee', name: 'Coffee', c: ['#16110d', '#201913', '#2b221a', '#362b21', '#45372b', '#f7efe6', '#bba892', '#d9a066', '#2a1606'] },
  { id: 'neon', name: 'Neon', c: ['#07070d', '#0f0f1a', '#171728', '#202036', '#2b2b47', '#f1f1ff', '#9d9dc4', '#ff3df2', '#2a0127'] },
  { id: 'noir', name: 'Noir', c: ['#000000', '#0e0e0e', '#1a1a1a', '#242424', '#333333', '#ffffff', '#a0a0a0', '#ffffff', '#000000'] },
  { id: 'blackblue', name: 'Black & Blue', c: ['#000000', '#121212', '#1f1f1f', '#2a2a2a', '#333333', '#ffffff', '#b3b3b3', '#1e90ff', '#000000'] },
  { id: 'paper', name: 'Paper', light: true, c: ['#faf7f2', '#ffffff', '#f1ece4', '#e8e1d6', '#ddd4c6', '#1f1a15', '#6b6157', '#d96a1e', '#ffffff'] },
  { id: 'daylight', name: 'Daylight', light: true, c: ['#f4f6fb', '#ffffff', '#e9edf6', '#dde3f0', '#cfd7e8', '#121826', '#5a6478', '#2f6bff', '#ffffff'] },
  { id: 'mint', name: 'Mint', light: true, c: ['#f2f8f4', '#ffffff', '#e3f0e7', '#d5e8db', '#c3dccb', '#10201a', '#52695d', '#1f9d63', '#ffffff'] },
  { id: 'blossom', name: 'Blossom', light: true, c: ['#fdf3f6', '#ffffff', '#f6e3ea', '#efd5df', '#e5c3d0', '#2a1420', '#7a5767', '#d6457f', '#ffffff'] }
];
window.murmurSpotifyGreys = function (c) {
  var grey = ['#121212', '#181818', '#242424', '#2e2e2e', '#383838'];
  var hex = function (h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); };
  var mix = function (a, b, w) { var x = hex(a), y = hex(b); return '#' + x.map(function (v, i) { return ('0' + Math.round(v * (1 - w) + y[i] * w).toString(16)).slice(-2); }).join(''); };
  return c.map(function (v, i) { return i < 5 ? mix(grey[i], v, 0.18) : v; });
};
window.murmurApplyTheme = function (id) {
  var t = window.MURMUR_THEMES.filter(function (x) { return x.id === id; })[0] || window.MURMUR_THEMES[0];
  var r = document.documentElement.style, n = ['--bg', '--panel', '--raise', '--hover', '--line', '--fg', '--muted', '--accent', '--accent-ink'];
  // Dark themes sit on Spotify's dark greys (not black), with just a hint of the theme's own colour.
  var c = t.light ? t.c : window.murmurSpotifyGreys(t.c);
  n.forEach(function (k, i) { r.setProperty(k, c[i]); });
  r.setProperty('--danger', t.light ? '#c0392b' : '#ff8e8e');
  r.setProperty('color-scheme', t.light ? 'light' : 'dark');
  document.documentElement.dataset.theme = t.id;
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', c[0]);
  // Murmur for Windows draws its own title bar: the window buttons take the theme's colours.
  var d = window.MurmurDesktop; if (d && d.setFrame) { document.documentElement.classList.add('desktop-frame'); d.setFrame(c[0], c[6]); }
  // The Android app colours the phone's status bar and navigation bar to match.
  var an = window.MurmurAndroid; if (an && an.setBars) try { an.setBars(c[0], !!t.light); } catch (e) {}
  return t.id;
};
try { window.murmurApplyTheme(JSON.parse(localStorage.getItem('murmur:theme') || '"murmur"')); } catch (e) {}
</script>

</head>
<title>Murmur Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  /* Layout: three-pane shell (library rail · main stage · now-playing card) over a transport bar; phones collapse to stage + mini player + tab bar */
  --bg:#121212; --panel:#181818; --raise:#242424; --hover:#2e2e2e; --line:#383838;
  --fg:#f5eff9; --muted:#a798b4; --accent:#ffb070; --accent-ink:#2b1505; --danger:#ff8e8e;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;max-width:100%;overflow-x:hidden}
.app{max-width:100vw}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
img{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
html.desktop-frame .app{padding-top:var(--tb-h)}
html.desktop-frame{--tb-h:36px}
html.desktop-frame body::before{content:'';position:fixed;top:0;left:0;right:0;height:var(--tb-h);background:var(--bg);-webkit-app-region:drag;app-region:drag;z-index:95}
html.desktop-frame .topbar{-webkit-app-region:drag;app-region:drag}
.soft-refresh{display:none}
html.desktop-frame .soft-refresh{display:inline-grid;-webkit-app-region:no-drag;app-region:no-drag}
.soft-refresh.spinning svg{animation:spin .8s linear infinite}
html.desktop-frame .topbar>*{-webkit-app-region:no-drag;app-region:no-drag}
html.desktop-frame .full,html.desktop-frame .modal-back{top:var(--tb-h)}
html.desktop-frame .menu,html.desktop-frame .toast{-webkit-app-region:no-drag;app-region:no-drag}
.upd-pill{position:fixed;top:4px;right:154px;z-index:96;height:28px;display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;border-radius:999px;background:var(--raise);border:1px solid var(--line);font-size:12px;font-weight:600;-webkit-app-region:no-drag;app-region:no-drag;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.upd-pill[hidden]{display:none}
.upd-bar{width:120px;height:5px;border-radius:9px;background:var(--hover);overflow:hidden}
.upd-bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .25s}
.upd-pill .upd-go{height:22px;padding:0 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px}
.upd-pill .upd-go:hover{filter:brightness(1.08)}
.upd-pill svg{width:14px;height:14px;color:var(--accent)}
html:not(.desktop-frame) .upd-pill{top:auto;bottom:96px;right:16px;height:34px}
.app{height:100%;display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:8px;padding:8px}
.app.np-on{grid-template-columns:280px minmax(0,1fr) 310px}
.sidebar{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.main{grid-column:2;grid-row:1}
.np-panel{grid-column:3;grid-row:1}
.app:not(.np-on) .np-panel{display:none}
.player{grid-column:1/-1;grid-row:2}
.bottom-nav{grid-column:1/-1;grid-row:3;display:none}
.panel{background:var(--panel);border-radius:var(--r)}

.nav{padding:18px 12px 10px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:0 12px 14px;font:800 23px/1 var(--font-display);letter-spacing:-.02em}
[data-act="logo-home"]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.brand svg,.m-brand svg{width:26px;height:26px;color:var(--accent)}
.nav-btn{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:8px;font-weight:700;color:var(--muted)}
.nav-btn:hover,.nav-btn.on{color:var(--fg)}
.nav-btn svg{width:22px;height:22px}
.library{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 8px 8px;overflow:hidden}
.lib-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 10px}
.lib-head h2{margin:0;font:700 15px var(--font-body);color:var(--muted);display:flex;gap:12px;align-items:center}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none;position:relative}
.icon-btn:hover{color:var(--fg);background:var(--hover)}
.icon-btn.on{color:var(--accent)}
.icon-btn.rep-one::after{content:"1";position:absolute;top:3px;right:3px;font-size:9px;font-weight:800;line-height:1}
.chips{display:flex;gap:6px;padding:0 8px 10px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:var(--raise);font-size:13px;font-weight:600}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--fg);color:var(--bg)}
body.drag-selecting{user-select:none;-webkit-user-select:none;cursor:grabbing}
body.drag-selecting .tracks{touch-action:none}
/* iPhone Safari zooms the page into any text box with text smaller than 16px; keep them at 16px on touch screens. */
@media (pointer:coarse){input:not([type=range]):not([type=file]):not([type=checkbox]):not([type=radio]),textarea,select{font-size:max(16px,1em)}}
/* Song rows never select text: on Android a press-and-hold would start text selection (~400ms) and take the touch away from drag-to-select. */
.tracks .row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.genre-chips{padding:2px 0 14px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.genre-chips::-webkit-scrollbar{display:none}
.st-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.st-head .greet{margin-right:auto}
.st-btns{display:inline-flex;gap:6px;flex:none}
.st-btn{padding:3px 9px;font-size:12px;gap:4px;display:inline-flex;align-items:center}
.st-btn svg{width:13px;height:13px}
body:not([data-view="search"]) .top-search{display:none}
#adminBtn{display:none!important}   /* Admin is on the account page now */
body:not([data-view="search"]) .topbar .top-right{margin-left:auto}
.rs-wrap{display:none}
body.tq-focus .rs-wrap{display:block}
body.tq-focus .mfy{display:none}
.rs-song img{width:42px;height:42px;border-radius:4px;object-fit:cover;flex:none}
.rs-tx{display:flex;flex-direction:column;min-width:0}
.rs-tx b{font-weight:600}
.gbox-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:24px}
@media (min-width:900px){.gbox-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gbox{position:relative;overflow:hidden;min-height:92px;border:0;border-radius:10px;padding:14px;text-align:left;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;flex-direction:column;justify-content:space-between;font:inherit}
.gbox span{font-weight:800;font-size:18px;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.gbox small{font-size:11px;opacity:.85}
.gbox::after{content:"";position:absolute;right:-18px;bottom:-18px;width:74px;height:74px;border-radius:12px;background:rgba(255,255,255,.18);transform:rotate(25deg)}
.gbox:active{transform:scale(.98)}
.rs-list{display:flex;flex-direction:column;gap:2px;margin:0 0 18px;max-width:640px}
.rs-item{display:flex;align-items:center;gap:4px;border-radius:8px}
.rs-item:hover{background:var(--raise)}
.rs-q{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 8px;background:none;border:0;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.rs-q svg{width:16px;height:16px;color:var(--muted);flex:none}
.rs-item .icon-btn{width:30px;height:30px}
.sort-btn.on{color:var(--accent)}
.menu button[data-act="sort-pick"].on{color:var(--accent)}
.genre-chips>*{flex:none;scroll-snap-align:start}
.chip-n{margin-left:6px;opacity:.6;font-weight:500}
.genre-btn{margin-top:8px}
.genre-pick{display:flex;flex-wrap:wrap;gap:6px}
.gp{position:relative;cursor:pointer}
.gp input{position:absolute;opacity:0;pointer-events:none}
.gp span{display:inline-block;padding:7px 13px;border-radius:999px;background:var(--raise);border:1px solid var(--line);color:var(--fg);font-size:13px;font-weight:600}
.gp:hover span{background:var(--hover)}
.gp input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gp input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.lib-list{overflow-y:auto;overflow-x:hidden;overscroll-behavior-x:none;min-height:0;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.lib-item{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:8px;cursor:pointer;min-width:0}
.lib-item:hover{background:var(--raise)}
.lib-item.on{background:var(--hover)}
.lib-item .cover{width:48px;height:48px;border-radius:6px}
.lib-item .meta{min-width:0;flex:1}
.lib-item .nm{font-weight:600}
.lib-item.playing .nm{color:var(--accent)}
.lib-item .sb{font-size:13px;color:var(--muted)}

.cover{object-fit:cover;background:var(--raise);flex:none;aspect-ratio:1;max-width:100%}
.mosaic{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.mosaic img{width:100%;height:100%;object-fit:cover}
.liked-cover{display:grid;place-items:center;background:linear-gradient(140deg,#5b35c9 0%,#c06ad8 55%,#ffb070 100%);color:#fff}
.liked-cover svg{width:42%;height:42%;fill:currentColor}
.round{border-radius:50%!important}

.main{background:var(--panel);border-radius:var(--r);overflow:auto;min-width:0;position:relative;overscroll-behavior:contain;scrollbar-width:thin}
.topbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:12px 24px;background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.topbar .icon-btn{background:var(--bg)}
.topbar .icon-btn:disabled{opacity:.4;cursor:default}
.m-brand{display:none;margin-left:auto;align-items:center;gap:8px;font:800 19px var(--font-display)}
.top-search{flex:1;max-width:460px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;margin-left:6px}
.top-search:focus-within{border-color:var(--fg)}
.top-search>svg{color:var(--muted);width:18px;height:18px}
.top-search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;font-size:15px;padding:9px 0;outline:none}
.top-search input::-webkit-search-cancel-button{display:none}
/* Clear search: a small filled circle with an x (big enough to tap, quiet to look at). */
.tq-clear{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;flex:none;transition:transform .12s}
.tq-clear svg{width:20px;height:20px;padding:5px;box-sizing:border-box;border-radius:50%;background:color-mix(in srgb,var(--fg) 45%,transparent);color:var(--bg);stroke-width:3.2;transition:background .15s}
.tq-clear:hover svg,.tq-clear:focus-visible svg{background:var(--fg)}
.tq-clear:active{transform:scale(.88)}
.search-title{font-size:clamp(22px,3vw,28px);overflow-wrap:anywhere}
.top-search{position:relative}
.tq-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.55);padding:6px;max-height:min(70vh,520px);overflow:auto}
.drop-h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 8px 4px}
.drop-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;font-size:14px;min-width:0}
.drop-item:hover,.drop-item.on{background:var(--hover)}
.drop-item img{width:38px;height:38px;border-radius:4px;object-fit:cover;flex:none}
.drop-item>svg{width:16px;height:16px;color:var(--muted);flex:none}
.drop-tx{display:flex;flex-direction:column;min-width:0;flex:1}
.drop-tx span{font-size:12px;color:var(--muted)}
.drop-item>.ell{flex:1}
.drop-all{border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:4px;padding-top:10px}
.drop-item kbd{font:600 11px var(--font-body);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;flex:none}
.yt-wait{margin:0}
.view{padding:4px 24px 48px}

/* ---------- home ---------- */
.greet{font:800 clamp(26px,3.4vw,34px)/1.1 var(--font-display);letter-spacing:-.02em;margin:8px 0 18px;text-wrap:balance}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.qt{display:flex;align-items:center;gap:12px;background:var(--raise);border-radius:6px;overflow:hidden;cursor:pointer;min-width:0;padding-right:10px}
.qt:hover{background:var(--hover)}
.qt .cover{width:60px;height:60px}
.qt .nm{font-weight:700;flex:1;min-width:0}
.qt .fab{position:static;width:36px;height:36px}
.ly-head{display:flex;align-items:center;gap:16px;margin:6px 0 22px}
.ly-head .cover{width:72px;height:72px;border-radius:8px;flex:none}
.ly-head h1{font:800 clamp(22px,3vw,30px)/1.15 var(--font-display);margin:0}
.ly-head>div{min-width:0}
.ly-lines{display:flex;flex-direction:column;gap:14px;padding-bottom:40vh}
.ly-lines.plain{padding-bottom:16px;gap:6px}
.ly-line{margin:0;font:700 clamp(22px,3.2vw,32px)/1.25 var(--font-display);color:color-mix(in srgb,var(--fg) 45%,transparent);transition:color .25s,transform .25s;text-wrap:balance}
.ly-lines.synced .ly-line{cursor:pointer}
.ly-lines.synced .ly-line:hover{color:color-mix(in srgb,var(--fg) 75%,transparent)}
.ly-line.past{color:color-mix(in srgb,var(--fg) 62%,transparent)}
.ly-line.on{color:var(--fg)}
.ly-lines.plain .ly-line{font-size:clamp(18px,2.4vw,22px);color:var(--fg)}
.ly-msg{margin:10px 0}
.ly-src{margin-top:18px}
#lyBtn.on{color:var(--accent)}
.gp-sug{margin:2px 0 10px}
.gp-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--raise);font-size:13px;cursor:pointer;list-style:none;user-select:none}
.gp-head::-webkit-details-marker{display:none}
.gp-head svg{width:15px;height:15px;color:var(--muted);flex:none}
.gp-head b{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp-n{font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.gp-head svg:last-child{transition:transform .15s}
.gp-sug[open] .gp-head svg:last-child{transform:rotate(90deg)}
.gp-sug[open] .gp-list{margin-top:6px}
.gp-list{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.gp-list::-webkit-scrollbar{display:none}
.gp-item{display:flex;align-items:center;gap:8px;padding:4px 2px 4px 4px;border-radius:8px;background:var(--raise);min-width:0;flex:none;max-width:230px}
.gp-item .gp-cover{width:32px;height:32px;flex:none;border-radius:4px}
.gp-item .icon-btn{width:26px;height:26px}
.gp-item .icon-btn svg{width:14px;height:14px}
.gp-meta{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.2}
.gp-meta b{font-size:13px}
.gp-meta .small{font-size:11px}
.gp-item{cursor:pointer}
.gp-item:hover{background:var(--hover)}
.gp-create{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qt-ic{display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 22%,var(--raise));color:var(--accent)}
.qt-ic svg{width:26px;height:26px}
.greet-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.greet-row .greet{margin-right:auto}
.home-edit{flex:none}
.he-list{list-style:none;margin:8px 0 14px;padding:0;display:flex;flex-direction:column;gap:4px;max-height:44vh;overflow:auto}
.he-list li{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:8px;background:color-mix(in srgb,var(--fg) 4%,transparent)}
.he-check{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.he-check>span{display:flex;flex-direction:column;min-width:0}
.he-check .small{font-size:12px}
.he-list .icon-btn svg{transform:rotate(-90deg)}
.he-list .he-down svg{transform:rotate(90deg)}
.he-list li:first-child [data-act="he-up"],.he-list li:last-child [data-act="he-down"]{visibility:hidden}
.he-h{margin:6px 0 2px;font-size:15px}
.he-sub{margin:10px 0 0;font-weight:700}
.he-sc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.he-chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--fg) 6%,transparent);font-size:13px;cursor:pointer}
.shelf-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 10px}
.shelf-head h2{margin:0;font:700 22px/1.2 var(--font-display);letter-spacing:-.01em}
.shelf-head p{margin:0;color:var(--muted);font-size:14px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,184px);gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -10px;scrollbar-width:thin}
.card{padding:10px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{background:var(--raise)}
.card-art{position:relative}
.card-art .cover{width:100%;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card-art .cover.round{border-radius:50%;aspect-ratio:1;object-fit:cover}
.hero-artist{color:var(--fg);font-weight:700}
.card .nm{font-weight:700}
.card .sb{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fab{position:absolute;right:8px;bottom:8px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.fab svg{width:20px;height:20px}
.card:hover .fab,.qt:hover .fab,.fab:focus-visible,.fab.on{opacity:1;transform:none}
.fab:hover{transform:scale(1.06)!important}

/* ---------- collection ---------- */
.hero{display:flex;gap:24px;align-items:flex-end;padding:28px 24px 24px;margin:-4px -24px 0;background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 46%,var(--panel)) 0%,color-mix(in srgb,var(--tint) 14%,var(--panel)) 100%)}
.hero-cover{width:clamp(140px,20vw,232px);border-radius:8px;box-shadow:0 14px 44px rgba(0,0,0,.5)}
.hero-meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.hero-meta .eyebrow{color:var(--fg)}
.hero h1,.title-input{font:800 clamp(30px,5.4vw,72px)/1.02 var(--font-display);letter-spacing:-.03em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.title-input{background:transparent;border:0;border-bottom:2px dashed transparent;color:var(--fg);width:100%;padding:0;border-radius:0}
.title-input:hover,.title-input:focus{border-bottom-color:color-mix(in srgb,var(--fg) 40%,transparent);outline:none}
.hero-desc{margin:0;color:color-mix(in srgb,var(--fg) 78%,transparent);max-width:60ch}
.hero-sub{margin:0;font-size:14px;color:color-mix(in srgb,var(--fg) 78%,transparent)}
.hero-sub b{color:var(--fg)}
.actions{display:flex;align-items:center;gap:14px;padding:22px 0 18px;flex-wrap:wrap}
.big-play{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.4);transition:transform .15s}
.big-play:hover{transform:scale(1.05)}
.big-play svg{width:24px;height:24px}
.actions .icon-btn{width:38px;height:38px}
.actions .icon-btn svg{width:20px;height:20px}
/* One button size everywhere: outlined pills 38px tall, icon-only ones 38px round, all with the same outline as Select. */
.actions .text-btn,.head-actions .text-btn,.actions .out-btn,.actions .dl-col,.actions .sort-btn{height:38px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.actions .text-btn,.head-actions .text-btn{padding:0 14px;font-size:14px}
.actions .out-btn,.actions .sort-btn{width:38px;padding:0}
.actions .dl-col{min-width:38px;padding:0 9px}
.actions .out-btn.on,.actions .dl-col.on,.actions .sort-btn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.text-btn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.text-btn:hover{color:var(--fg);border-color:var(--muted)}
.text-btn.danger{color:var(--danger);border-color:var(--danger)}

.tracks{display:flex;flex-direction:column}
.thead,.row{display:grid;grid-template-columns:28px minmax(0,4fr) minmax(0,3fr) 36px 48px 36px;align-items:center;gap:12px;padding:6px 12px;border-radius:6px}
.thead{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:8px;padding-bottom:8px}
.thead .r{text-align:right}
.row{cursor:pointer}
.row:hover{background:var(--raise)}
.row .num{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;display:flex;justify-content:flex-end}
.row .eq{display:none}
/* Liked Songs: every song there is liked, so no heart (unlike it from the ⋯ menu). */
.tracks[data-ctx-type="liked"] .row .like{visibility:hidden;pointer-events:none}
.row.is-current .t{color:var(--accent)}
.row.is-current{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.row.is-current:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.row.is-current.is-playing .n{display:none}
.row.is-current.is-playing .eq{display:inline-flex}
.ti{display:flex;gap:12px;align-items:center;min-width:0}
.ti img{width:42px;height:42px;border-radius:4px}
.ti .tx{min-width:0}
.t{display:block;font-weight:600}
.a{display:block;font-size:13px;color:var(--muted)}
.a button:hover,.p-artist:hover,.alb:hover,.full-artist:hover,.np-artist:hover{text-decoration:underline;color:var(--fg)}
.alb{color:var(--muted);font-size:14px;justify-self:start;max-width:100%}
.dur{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.row .icon-btn{width:32px;height:32px}
.row .like,.row .more{opacity:0}
.row:hover .like,.row:hover .more,.row .like.on,.row:focus-within .more{opacity:1}
.like.on{color:var(--accent)}
.like.on svg{fill:currentColor}
.add-btn{padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700}
.add-btn:hover{border-color:var(--fg)}
.row.plain{grid-template-columns:minmax(0,1fr) auto}
.eq{gap:2px;height:14px;align-items:flex-end}
.eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.27s}
.eq i:nth-child(3){animation-delay:-.53s}
@keyframes eq{from{height:3px}to{height:14px}}
.empty{padding:40px 0;color:var(--muted);max-width:46ch}
.empty h2{color:var(--fg);font:700 22px var(--font-display);margin:0 0 6px}

/* ---------- search ---------- */
.search-box{display:flex;align-items:center;gap:10px;background:var(--raise);border-radius:999px;padding:0 18px;max-width:480px;border:1px solid var(--line);margin:6px 0 4px}
.search-box:focus-within{border-color:var(--fg)}
.search-box input{flex:1;background:none;border:0;color:var(--fg);font:inherit;font-size:16px;padding:13px 0;outline:none;min-width:0}
.search-box svg{color:var(--muted)}
/* Browse all: two rows you swipe left and right through, instead of a tall stack. */
.genres{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:180px;gap:14px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding-bottom:4px}
.genres::-webkit-scrollbar{display:none}
.genres>*{scroll-snap-align:start}
.gt{aspect-ratio:1.55;border-radius:10px;padding:14px 16px;font:800 21px/1.1 var(--font-display);position:relative;overflow:hidden;cursor:pointer;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.gt small{font:600 12px var(--font-body);opacity:.8;letter-spacing:.02em}
.gt img{position:absolute;width:44%;right:-6%;bottom:-6%;transform:rotate(18deg);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.gt span{position:relative;z-index:1;max-width:60%}
.artist-chips{display:flex;flex-wrap:wrap;gap:8px}
.ac{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;background:var(--raise);border-radius:999px;font-weight:600}
.ac:hover{background:var(--hover)}
.ac img{width:36px;height:36px;border-radius:50%;object-fit:cover}

/* ---------- player ---------- */
.player{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);align-items:center;gap:16px;padding:6px 8px 2px;min-height:76px;position:relative}
.p-left{display:flex;align-items:center;gap:12px;min-width:0;touch-action:pan-y}
#fCover{touch-action:none}
.full{touch-action:none}
.full.scrolls{touch-action:pan-y}
.full.scrolls .full-top{touch-action:none}
.p-cover{width:56px;height:56px;border-radius:6px;cursor:pointer}
.p-meta{min-width:0}
.p-title{font-weight:700;font-size:14px}
.p-artist,.np-artist,.full-artist{font-size:13px;color:var(--muted);display:block;max-width:100%}
.p-center{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.controls{display:flex;align-items:center;gap:12px}
.play-btn{width:38px;height:38px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;transition:transform .12s;flex:none}
.play-btn:hover{transform:scale(1.06)}
.seek-row{display:flex;align-items:center;gap:10px;width:100%;max-width:640px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seek-row span{min-width:34px;text-align:center}
.p-right{display:flex;justify-content:flex-end;align-items:center;gap:2px}
.vol{width:110px!important}
.p-mini,.p-mini-ctrl,.mini-bar{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fg) var(--p),var(--line) var(--p))}
input[type=range]:hover::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--fg);margin-top:-4px;opacity:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--fg)}
input[type=range]:hover::-moz-range-progress{background:var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--fg)}

/* ---------- now playing panel ---------- */
.np-panel{overflow:auto;min-width:0;padding:16px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.np-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.np-cover{width:100%;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.np-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.np-meta h3{margin:0;font:800 22px/1.15 var(--font-display);letter-spacing:-.01em}
.np-btns{display:flex;flex:none}
.rn-sug{margin-top:10px}
.rn-list{display:flex;flex-direction:column;gap:4px;max-height:40vh;overflow-y:auto;overflow-x:hidden;margin:6px -4px 0}
.rn-item{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;text-align:left;min-width:0;border:1px solid transparent}
.rn-item:hover{background:var(--raise)}
.rn-item.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.rn-item img{width:40px;height:40px;border-radius:4px;object-fit:cover;flex:none}
.rn-item>span{display:flex;flex-direction:column;min-width:0}
.np-card{background:var(--raise);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.np-card-head{display:flex;justify-content:space-between;align-items:center}
.np-card-head button{font-size:13px;font-weight:700;color:var(--muted)}
.np-card-head button:hover{color:var(--fg);text-decoration:underline}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted);margin:0}
.prog{font-family:var(--font-display);font-weight:600;color:var(--fg);letter-spacing:.02em}

/* ---------- full player ---------- */
.full{position:fixed;inset:0;z-index:40;overflow:auto;background:linear-gradient(180deg,color-mix(in srgb,var(--tint,#5a3478) 55%,var(--bg)) 0%,var(--bg) 78%);padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.full-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
/* Equal side columns keep "Playing from" in the exact middle whatever buttons sit on each side. */
.full-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) minmax(0,1fr);align-items:center;gap:8px;text-align:center}
.full-top>.icon-btn{justify-self:start}
.full-top-r{justify-self:end}
.full-ctx{min-width:0;text-align:center}
.full-top .eyebrow{color:var(--fg);opacity:.8;display:block}
.full-ctx b{font-weight:700;font-size:14px;display:block}
.full-cover{width:min(100%,46vh);align-self:center;border-radius:10px;box-shadow:0 22px 56px rgba(0,0,0,.55)}
#viz{width:100%;height:52px;display:block}
#full #viz{display:none}   /* the moving bars under the cover looked like dashes */
.full-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.full-meta>div{min-width:0}
.full-title{font:800 26px/1.15 var(--font-display);letter-spacing:-.01em}
.full-artist{font-size:15px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.controls.big{justify-content:space-between}
.controls.big .play-btn{width:66px;height:66px}
.controls.big .play-btn svg{width:28px;height:28px}
.controls.big .icon-btn{width:44px;height:44px}
.controls.big .icon-btn svg{width:26px;height:26px}

/* ---------- menu / toast ---------- */
.menu{position:fixed;z-index:60;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:4px;width:min(290px,calc(100vw - 16px));max-height:70vh;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.menu-title{padding:8px 12px 6px;font-size:12px;color:var(--muted);font-weight:700}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:5px;font-size:14px;font-weight:500;text-align:left}
.menu button svg{flex:none;width:18px;height:18px}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:110;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.toast.show{animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- uploads ---------- */
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.up-btn{display:flex;align-items:center;gap:8px;color:var(--fg);background:var(--bg)}
.dl-dot{display:none;color:var(--accent);margin-right:5px;vertical-align:-2px}
.dl-dot svg{width:13px;height:13px}
.row.is-dl .dl-dot{display:inline-block}
.row.is-dling .t::after{content:" · downloading";color:var(--muted);font-weight:500;font-size:12px}
.dl-btn.on{color:var(--accent)}
.dl-col{font-weight:600;width:auto;min-width:36px;padding:0 6px;gap:3px;display:inline-flex;align-items:center;justify-content:center}
.dl-count{font-size:11px}
.dl-note{color:var(--muted);flex-basis:100%}
.dl-note:empty{display:none}
.dl-col svg{width:20px;height:20px}
.dl-btn.busy{color:var(--accent)}
/* Servers page */
.srv-head .st-btn.spinning svg{animation:spin .9s linear infinite}
.srv-hero{--c:var(--accent);position:relative;display:flex;align-items:center;gap:16px;padding:18px 20px;margin:0 0 26px;border-radius:18px;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--c) 34%,transparent);
  background:linear-gradient(120deg,color-mix(in srgb,var(--c) 28%,var(--bg)) 0%,color-mix(in srgb,var(--c) 8%,var(--bg)) 60%,color-mix(in srgb,var(--c) 18%,var(--bg)) 100%);
  box-shadow:0 14px 34px -18px color-mix(in srgb,var(--c) 80%,transparent)}
.srv-hero-ic{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:color-mix(in srgb,var(--c) 26%,transparent);color:var(--c)}
.srv-hero-ic svg{width:28px;height:28px}
.srv-hero-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.srv-hero-txt b{font:800 clamp(20px,2.6vw,26px)/1.15 var(--font-display);letter-spacing:-.01em}
.srv-h2{font:800 20px var(--font-display);margin:0 0 12px}
.srv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.srv-card{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);transition:background .15s}
.srv-card:hover{background:var(--hover)}
.srv-card.here{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.srv-card.down{opacity:.6}
.srv-card-top{display:flex;align-items:center;gap:12px}
.srv-ic{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--raise);color:var(--accent)}
.srv-card.down .srv-ic{color:var(--muted)}
.srv-ic svg{width:20px;height:20px}
.srv-card-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.srv-card-name b{font:700 15px var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.top-status{--c:var(--accent);position:relative;display:none;align-items:center;gap:10px;height:44px;padding:0 12px 0 8px;overflow:hidden;isolation:isolate;
  border:1px solid color-mix(in srgb,var(--c) 34%,transparent);border-radius:16px;color:var(--fg);text-align:left;cursor:pointer;
  background:linear-gradient(120deg,color-mix(in srgb,var(--c) 26%,var(--bg)) 0%,color-mix(in srgb,var(--c) 8%,var(--bg)) 55%,color-mix(in srgb,var(--c) 16%,var(--bg)) 100%);
  box-shadow:0 6px 18px -10px color-mix(in srgb,var(--c) 70%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 10%,transparent);transition:transform .15s}
.top-status:active{transform:scale(.97)}
.top-status.warn{--c:#f5a623}
.top-status::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,#fff 9%,transparent) 50%,transparent 70%);transform:translateX(-100%);animation:tsShine 6s ease-in-out infinite}
@keyframes tsShine{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.top-status .ts-fill{position:absolute;inset:0 auto 0 0;z-index:-1;width:var(--p,0%);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,transparent),color-mix(in srgb,var(--c) 42%,transparent));transition:width .4s}
.top-status .ts-ic{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:11px;background:color-mix(in srgb,var(--c) 24%,transparent);color:var(--c)}
.top-status .ts-ic svg{width:17px;height:17px}
.top-status .ts-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}

.top-status .ts-txt small{font:500 11.5px var(--font-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;padding:6px 0 6px 6px;margin:-6px 0 -6px -6px}   /* room for the pulsing ring around the dot, so it isn't cut off */
.top-status .ts-dot{flex:none;width:6px;height:6px;border-radius:50%;background:#3ddc84;animation:tsPulse 2.2s ease-out infinite}
.top-status.warn .ts-dot{background:#f5a623}
@keyframes tsPulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.65)}100%{box-shadow:0 0 0 5px rgba(61,220,132,0)}}
.top-status .ts-end{flex:none;font:800 12px var(--font-display);color:var(--c)}

/* ---------- YouTube ---------- */
.yt-box{position:fixed;right:16px;bottom:100px;z-index:45;width:min(356px,calc(100vw - 32px));background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.55)}
.yt-frame{aspect-ratio:16/9;width:100%}
.yt-frame iframe{width:100%;height:100%;display:block;border:0}
.yt-bar{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--raise);cursor:grab;touch-action:none;user-select:none}
/* In the bar: the video fills the cover-art spot. Clicks go through to the cover (open the full player). */
/* Big view: the video fills the cover-art spot in the full-screen player. */
.yt-box.docked{position:fixed;border:0;box-shadow:0 22px 56px rgba(0,0,0,.55);z-index:41}
.yt-box.docked .yt-frame{width:100%;height:100%;aspect-ratio:auto;overflow:hidden;position:relative}
.yt-box.docked .yt-frame iframe{position:absolute;top:0;left:50%;width:177.78%;height:100%;transform:translateX(-50%)}
/* Everywhere else: the player keeps a normal size so it plays, but it isn't shown. */
.yt-box.audio-only{left:0!important;right:auto!important;top:auto!important;bottom:0!important;width:320px;opacity:0;pointer-events:none;z-index:-1;clip-path:inset(50%);border:0;box-shadow:none}
.yt-box .yt-bar{display:none}
.video-switch{display:flex;align-self:center;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.video-switch button{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.video-switch button.on{background:var(--fg);color:var(--bg)}
/* Spotify imports */
.row.ghost .ti img{filter:grayscale(1);opacity:.5}
.row.ghost .t,.row.ghost .a>button,.row.ghost .alb,.row.ghost .dur{opacity:.55}
.row.ghost:hover .t{opacity:.85}
.sp-chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:1px;border:1px solid var(--line);color:var(--muted)}
.sp-chip.in{border-color:transparent;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.sp-chip.yt{border-color:transparent;background:color-mix(in srgb,#e0473f 22%,transparent);color:var(--danger)}
.sp-chip.none{border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger)}
.sp-av{background:#2fa36b;color:#fff}
.disc-badge{background:#5d8bf4}
.sp-av svg{width:16px;height:16px}
.ver-list{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto;margin:0 -4px}
.ver{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;cursor:pointer;color:var(--fg)}
.ver:hover{background:var(--hover)}
.ver input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.ver img,.ver-ph{width:48px;height:48px;border-radius:4px;object-fit:cover;flex:none}
.ver-ph{display:grid;place-items:center;background:linear-gradient(140deg,#5b35c9,#ffb070);color:#fff}

.steps code{font-size:12px;background:var(--bg);padding:1px 6px;border-radius:4px;user-select:all;word-break:break-all}
.yt-bar a,.steps a{color:var(--accent)}
.yt-badge{position:absolute;left:8px;top:8px;background:#e0473f;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.02em}

document.addEventListener('submit', async e => {
  if (e.target.id === 'gForm') { e.preventDefault(); gateSubmit(e.target); return; }
  if (e.target.id === 'addPerson') { e.preventDefault(); addPerson(e.target); return; }

    e.preventDefault();
    const btn = e.target.querySelector('.m-ok'); btn.disabled = true; btn.textContent = 'Checking…';

    e.preventDefault();
    const btn = e.target.querySelector('.m-ok'); btn.disabled = true; btn.textContent = 'Checking…';
    await setSource(e.target.dataset.src, { key: String(new FormData(e.target).get('key') || '') });
    return;
  }
  if (e.target.id === 'spKeyForm') {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      const r = await api('PUT', 'api/settings/spotify', { clientId: fd.get('clientId'), clientSecret: fd.get('clientSecret') || '' });
      sp.clientId = r.spotifyClientId; sp.fullLinks = !!r.spotifyFullLinks;

    }
    catch (err) { toast(err.message); }
    return;
  }
  if (e.target.id === 'mailForm') {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      mailCfg = await api('PUT', 'api/mail/settings', { user: fd.get('user'), pass: fd.get('pass') || '', fromName: fd.get('fromName'), host: fd.get('host') || '', port: fd.get('port') || '' });
      toast(mailCfg.ready ? 'Saved. Send yourself a test email to check it works.' : 'Saved'); render();
    } catch (err) { toast(err.message); }

  if (e.target.id === 'ytKeyForm') {
    e.preventDefault();
    const btn = e.target.querySelector('.m-ok'); btn.disabled = true; btn.textContent = 'Checking key…';
    try {
      const had = yt.enabled;
      await api('PUT', 'api/settings/youtube', { key: new FormData(e.target).get('key') });
      try { const ys = await api('GET', 'api/youtube/status'); yt.keys = ys.keys || []; } catch (er) {}
      yt.enabled = true; toast(had ? 'Key added. Murmur moves to it when the others run out.' : 'YouTube connected. Suggestions are on Home.'); render(); if (!had) loadSuggestions();
    } catch (err) { toast(err.message); btn.disabled = false; btn.textContent = 'Connect YouTube'; }
    return;
  }
  if (e.target.id !== 'mForm') return;
  e.preventDefault();
  const fn = modalSubmit, fd = new FormData(e.target);
  closeModal();
  if (fn) await fn(fd);
});
document.addEventListener('input', e => {

    seeking = true;
    const pos = t.value / 1000 * Engine.duration;
    t.style.setProperty('--p', (t.value / 10) + '%');
    $$('[data-pos]').forEach(s => s.textContent = fmt(pos));

    state.volume = t.value / 100; state.muted = false; store.set('volume', state.volume);

const sp = { clientId: '', fullLinks: false, imports: [], matches: {}, token: null };
const SP_SCOPES = 'playlist-read-private playlist-read-collaborative user-library-read';
const SPALBUM = { id: 'spotify', title: 'From Spotify', artist: 'Spotify', year: 'Imported', genre: 'spotify', seed: 11,
  colors: ['#2fa36b', '#12261c', '#ffb070'], desc: 'Every song from your imported Spotify playlists.', trackIds: [] };

function addSpTrack(x, source = 'spotify') {
  const id = 'sp-' + hashStr(x.key).toString(36) + hashStr('m' + x.key).toString(36);
  if (TRACKS[id] && !(TRACKS[id].disc && source === 'spotify')) return id;   // an imported copy wins over a suggestion

    isrc: x.isrc, url: x.url, because: x.because || '', seed: hashStr(id) };

/* 'file' = your copy is in Murmur, 'yt' = plays from YouTube, 'none' = nothing found, 'new' = not looked up yet */
function spStatus(id) {
  const t = TRACKS[id]; if (!t || !t.sp) return '';
  const m = sp.matches[t.key] || {};
  if (m.file && TRACKS['f-' + m.file]) return 'file';
  if (m.yt && ytFile.has(m.yt.id)) return 'file';   // its YouTube match was brought into Murmur

const SP_CHIP = { file: ['In Murmur', 'in'], yt: ['YouTube', 'yt'], none: ['Not found', 'none'], new: ['Not in Murmur', 'new'] };
function spChip(id) { const s = spStatus(id); return s ? `<span class="sp-chip ${SP_CHIP[s][1]}">${SP_CHIP[s][0]}</span>` : ''; }

/* Pick the YouTube result that's most likely the same recording. */
function pickBest(t, ids) {
  const artist = normKey(t.artist.split(',')[0]), title = normKey(t.title);
  const bad = /\b(live|cover|karaoke|instrumental|remix|sped up|slowed|8d|reaction|nightcore|reverb|clean|censored|censurad[oa]|radio edit|radio version|kidz bop|sin groserias|version limpia)\b/;
  let best = null, top = -Infinity;
  ids.forEach(id => {
    const v = TRACKS[id]; if (!v) return;
    const vt = normKey(v.title), ch = normKey(v.artist);
    let s = 0;
    const dd = Math.abs((v.duration || 0) - (t.duration || 0));
    s -= t.duration ? (dd > 25 ? 60 : dd) : 0;
    if (artist && (ch.includes(artist) || artist.includes(ch) || vt.includes(artist))) s += 30;
    if (title && vt.includes(title)) s += 25;
    if (bad.test(vt) && !bad.test(title)) s -= 45;
    if (/\b(explicit|uncensored|dirty|sin censura)\b/.test(vt)) s += 8;
    if (s > top) { top = s; best = id; }

  return top > -45 ? best : null;
}
/* Turn an imported song into something the engine can play. */
async function resolveSp(t) {
  const m = sp.matches[t.key] || {};
  if (m.file && TRACKS['f-' + m.file]) return TRACKS['f-' + m.file];
  if (m.yt) return TRACKS[addYtTrack(m.yt)];
  if (!server.on || !yt.enabled) { toast('This song isn’t in Murmur yet. Connect YouTube in People & settings to play it, or use ⋯ → Bring into Murmur.'); return null; }
  let ids;
  try { ids = await ytSearch(`${t.artist.split(',')[0]} - ${t.title}`, '', true); } catch (e) { toast(e.message); return null; }
  const best = pickBest(t, ids);
  // Saved in the background: the song starts without waiting for it.
  saveMatch(t.key, best ? { yt: ytMeta(best) } : { none: true }).then(syncSpChips);
  return best ? TRACKS[best] : null;
}
function syncSpChips() {
  $$('.row[data-tid^="sp-"]').forEach(r => {

/* ---------- Spotify sign-in (PKCE, in the browser) ---------- */
async function spLogin() {
  if (!sp.clientId) { toast('Spotify isn’t set up yet. The owner can add it under People & settings.'); return; }
  if (!window.crypto || !crypto.subtle) { toast('Importing needs a secure address. Open Murmur from your https:// address or http://127.0.0.1:8080.'); return; }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
  const st = b64url(crypto.getRandomValues(new Uint8Array(12)));
  sessionStorage.setItem('murmur:spauth', JSON.stringify({ verifier, state: st }));
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({ response_type: 'code', client_id: sp.clientId,
    scope: SP_SCOPES, redirect_uri: spRedirect(), code_challenge_method: 'S256', code_challenge: challenge, state: st });
}
function spSaveToken(j) {
  sp.token = { access: j.access_token, refresh: j.refresh_token || (sp.token && sp.token.refresh), exp: Date.now() + ((j.expires_in || 3600) - 60) * 1000 };
  try { sessionStorage.setItem('murmur:sptok', JSON.stringify(sp.token)); } catch (e) {}
}
async function spFinishLogin() {
  const p = new URLSearchParams(location.search);
  if (!p.has('state') || (!p.has('code') && !p.has('error'))) return false;
  history.replaceState(history.state, '', spRedirect());
  let saved = null; try { saved = JSON.parse(sessionStorage.getItem('murmur:spauth') || 'null'); } catch (e) {}
  sessionStorage.removeItem('murmur:spauth');
  if (p.get('error')) { toast(p.get('error') === 'access_denied' ? 'Spotify sign-in was cancelled.' : 'Spotify said: ' + p.get('error')); return true; }
  if (!saved || saved.state !== p.get('state')) { toast('That Spotify sign-in didn’t match. Try importing again.'); return true; }
  const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'authorization_code', code: p.get('code'), redirect_uri: spRedirect(), client_id: sp.clientId, code_verifier: saved.verifier }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast('Spotify sign-in failed: ' + (j.error_description || j.error || r.status)); return true; }
  spSaveToken(j);
  openImportPicker();
  return true;
}
async function spAccess() {
  if (!sp.token) { try { sp.token = JSON.parse(sessionStorage.getItem('murmur:sptok') || 'null'); } catch (e) {} }
  if (!sp.token) return null;
  if (Date.now() < sp.token.exp) return sp.token.access;
  if (!sp.token.refresh) return null;
  const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: sp.token.refresh, client_id: sp.clientId }) });
  if (!r.ok) { sp.token = null; sessionStorage.removeItem('murmur:sptok'); return null; }
  spSaveToken(await r.json());
  return sp.token.access;
}
async function spGet(url) {
  const tok = await spAccess();
  if (!tok) throw Object.assign(new Error('Sign in to Spotify again.'), { login: true });
  for (let tries = 0; tries < 5; tries++) {
    const r = await fetch(url.startsWith('http') ? url : 'https://api.spotify.com/v1/' + url, { headers: { Authorization: 'Bearer ' + tok } });
    if (r.status === 429) { await new Promise(res => setTimeout(res, (Number(r.headers.get('Retry-After')) || 2) * 1000)); continue; }
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { sp.token = null; sessionStorage.removeItem('murmur:sptok'); throw Object.assign(new Error('Sign in to Spotify again.'), { login: true }); }
    if (r.status === 403) throw new Error((j.error && j.error.message) || 'Spotify didn’t allow this. Make sure your Spotify account is added under User Management in the Spotify app settings.');
    if (!r.ok) throw Object.assign(new Error((j.error && j.error.message) || `Spotify answered ${r.status}.`), { status: r.status });
    return j;
  }
  throw new Error('Spotify is busy. Try again in a minute.');
}
async function spTracks(id) {
  const out = [];
  let url = id === 'liked' ? 'me/tracks?limit=50' : `playlists/${id}/tracks?limit=100`;
  let triedItems = false;
  while (url) {
    let j;
    try { j = await spGet(url); }
    catch (e) {
      // Newer Spotify apps read playlist songs from /items instead of /tracks.
      if (!e.login && id !== 'liked' && !triedItems && !out.length) { triedItems = true; url = `playlists/${id}/items?limit=100`; continue; }
      throw e;
    }
    (j.items || []).forEach(it => {
      const tr = it && (it.track || it.item);
      if (!tr || (tr.type && tr.type !== 'track') || !tr.name) return;
      const imgs = (tr.album && tr.album.images) || [];
      const x = { title: tr.name, artist: (tr.artists || []).map(a => a.name).filter(Boolean).join(', '), album: (tr.album && tr.album.name) || '',
        cover: (imgs[1] || imgs[0] || {}).url || '', duration: Math.round((tr.duration_ms || 0) / 1000),
        isrc: (tr.external_ids && tr.external_ids.isrc) || '', url: (tr.external_urls && tr.external_urls.spotify) || '' };
      x.key = matchKey({ isrc: x.isrc, artist: x.artist.split(',')[0], title: x.title });
      out.push(x);

  openModal({ title: 'Import from Spotify', confirm: 'Import', html: `<p>Pick what to bring over. Only the song lists are copied; songs play from YouTube until you bring your own copy into Murmur.</p>
    <div class="ver-list">${row('liked', 'Liked Songs', 'Your saved songs on Spotify')}${lists.map(l => row(l.id, l.name, `${(l.tracks && l.tracks.total) || (l.items && l.items.total) || 0} songs · by ${(l.owner && l.owner.display_name) || 'Spotify'}`, ((l.images || [])[0] || {}).url)).join('')}</div>`,

async function importPlaylists(ids, lists) {
  if (!ids.length) return;
  let done = 0, firstId = null;

/* The artists you actually listen to: liked songs count most, then plays, Spotify imports and uploads. Demo artists are skipped. */
function discoverSeeds(genre) {
  const demo = new Set(ARTISTS.map(a => a.toLowerCase())), w = new Map();
  const add = (a, n) => { a = cleanArtist(a); if (!a || demo.has(a.toLowerCase()) || /^(unknown artist|youtube|various artists|spotify)$/i.test(a)) return; w.set(a, (w.get(a) || 0) + n); };
  const weigh = (id, n) => { const t = TRACKS[id]; if (t && visible(id) && (t.src || t.yt || t.sp) && (!genre || genreFor(id) === genre)) add(t.artist, n); };
  const plays = store.get('plays', {});
  state.liked.forEach(id => weigh(id, 3));
  Object.entries(plays).forEach(([id, n]) => weigh(id, Math.min(n, 5)));
  sp.imports.forEach(i => (i.trackIds || []).forEach(id => { if (!TRACKS[id].disc) weigh(id, 0.3); }));
  UPLOADS.trackIds.forEach(id => weigh(id, 0.5));
  return [...w.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([a]) => a);
}

  else {

/* ================= sign-in (Docker server only) ================= */
const PIN_ATTRS = 'type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" minlength="4" required autocomplete="off" class="pin"';
/* A server that's switched off (the laptop asleep behind Tailscale Funnel) doesn't refuse the connection, it
   just never answers, so every check gives up after a few seconds instead of hanging for a minute or more. */
async function getStatus(base, ms = 8000, token = remote.token) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  let r;
  try { r = await fetch(joinUrl(base, 'api/auth/status'), { cache: 'no-store', signal: ctl.signal, headers: base && token ? { Authorization: 'Bearer ' + token } : {} }); }
  finally { clearTimeout(t); }
  if (!r.ok) throw new Error();
  const st = await r.json();
  if (!st || typeof st.setup !== 'boolean') throw new Error();
  return st;
}
/* Ask every server at once and use the first one in order of preference that answers, so a switched-off
   server costs a few seconds at most instead of one long wait per server. A second, more patient round
   covers a slow phone connection before Murmur decides nothing can be reached. */
async function firstServer(bases) {
  for (const ms of [5000, 15000]) {
    const keep = { ...remote };
    const checks = bases.map(b => {
      remote.base = b; loadToken();   // each server has its own sign-in
      return getStatus(b, ms, remote.token).then(st => ({ base: b, st }), () => null);
    });
    Object.assign(remote, keep);
    for (const c of checks) { const r = await c; if (r) return r; }
  }
  return null;
}
async function checkAuth() {
  let st = null;
  // Is this page served by the Murmur server itself? (GitHub Pages, where the Android app opens, never is: skip asking.)
  if (!/\.github\.io$/.test(location.hostname)) { try { st = await getStatus(''); } catch (e) {} }
  remote.hosted = !!st;
  if (!st) {
    const base = savedServer();
    if (!base) {
      if (cfg) return 'connect';                     // hosted copy with no server address yet
      const c = store.get('auth', null);             // the claude.ai demo, or opened offline
      if (c) { me = c; return 'offline'; }           // even an ended sign-in can play what's downloaded here
      return c ? 'offline-expired' : 'demo';
    }
    const tries = [normalizeServer(base), ...SERVERS.map(x => normalizeServer(x.url))].filter((v, i, a) => v && a.indexOf(v) === i);
    const found = await firstServer(tries);
    if (!found) {
      remote.base = tries[0]; loadToken();
      const c = store.get('auth', null);
      // No server answers: play what's downloaded on this device (even if the sign-in has ended; the PIN is
      // asked for again once a server is back).
      if (c) { me = c; return 'offline'; }
      return 'unreachable';
    }
    st = found.st; remote.base = found.base; loadToken();
    // Say so when the chosen server is off, but not on every launch while it stays off.
    if (remote.base !== tries[0]) {
      const note = tries[0] + '>' + remote.base, last = store.get('fallbackNote', null);
      if (!last || last.k !== note || Date.now() - last.at > 12 * 3600e3) {
        store.set('fallbackNote', { k: note, at: Date.now() });
        setTimeout(() => toast(`${serverLabel(tries[0])} is off right now, so you’re on ${serverLabel(remote.base)}`), 1500);

    const idle = !p.last ? 'Hasn’t used Murmur since this started' : Date.now() - p.last > 14 * 864e5 ? `Not used in ${Math.floor((Date.now() - p.last) / 864e5)} days` : '';
    // Folded to one line per person until opened, so the list stays short.
    return `<details class="person act-card adm-fold${idle ? ' act-idle' : ''}" data-fk="act:${esc(u.id)}"${admOpen.has('act:' + u.id) ? ' open' : ''}>
      <summary class="person-head">${avatarHTML(u)}<div class="person-meta"><h3>${esc(u.name)}</h3>
        <span class="small">${hm(sum(p, 7, 'play'))} music this week · ${p.last ? `online ${ago(p.last)}` : 'never seen yet'}</span></div><span class="act-chev">${icon('chev')}</span></summary>
      <p class="small">${p.last ? `Last online ${ago(p.last)}` : 'Never seen yet'}${p.lastPlay ? ` · last played music ${ago(p.lastPlay)}` : ''}</p>
      ${idle ? `<p class="act-warn small">${idle}</p>` : ''}
      <dl class="act-stats">
        <div><dt>Days online</dt><dd>${on30}<span class="small"> of the last 30</span></dd></div>
        <div><dt>Music played</dt><dd>${hm(sum(p, 7, 'play'))}<span class="small"> this week · ${hm(play30)} in 30 days</span></dd></div>
        <div><dt>App open</dt><dd>${hm(sum(p, 7, 'on'))}<span class="small"> this week · ${hm(sum(p, 30, 'on'))} in 30 days</span></dd></div>
      </dl>
      <div class="act-bars" role="img" aria-label="Music played each day, last 14 days">${days.map(d => { const v = (p.days[d] || {}).play || 0;
        return `<span title="${d}: ${hm(v)}" style="height:${Math.max(v ? 6 : 2, Math.round(v / max * 100))}%"></span>`; }).join('')}</div>
      <div class="act-bars-l small"><span>2 weeks ago</span><span>today</span></div>
      <div class="act-top"><span class="small">Genres</span>${top(p.genres, 5)}</div>
      <div class="act-top"><span class="small">Artists</span>${top(p.artists, 5)}</div>
    </details>`; }).join('')}</div>
  <button type="button" class="text-btn" data-act="act-refresh">${icon('repeat')}<span>Refresh</span></button>`;
}

/* While Murmur is open and signed in: once a minute, how long it was in view and how long music played. */
const usage = { on: 0, play: 0, tick: Date.now() };
setInterval(() => {
  const now = Date.now(), dt = Math.min(10, (now - usage.tick) / 1000); usage.tick = now;
  if (document.visibilityState === 'visible') usage.on += dt;
  if (typeof Engine !== 'undefined' && Engine.playing) usage.play += dt;
}, 5000);
setInterval(() => {
  if (!me || !server.on || (usage.on < 5 && usage.play < 5)) return;
  const t = state.current && TRACKS[state.current];
  const body = { online: Math.round(usage.on), played: Math.round(usage.play), genre: t ? ((g => g && g[0] !== '\u0000' ? g : '')(genreFor(t.id))) : '', artist: t ? cleanArtist(t.artist) : '' };
  usage.on = 0; usage.play = 0;
  api('POST', 'api/me/activity', body).catch(() => {});
}, 60e3);

/* ================= boot ================= */
(async () => {
  buildShell();
  $('#main').addEventListener('scroll', closeMenu, { passive: true });
  const mode = await checkAuth();
  if (resetToken && !['connect', 'unreachable', 'offline-expired'].includes(mode)) { showGate('reset'); return; }   // opened from a PIN reset email
  if ((server.auth || cfg) && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
  if (['setup', 'login', 'expired', 'offline-expired', 'connect', 'unreachable'].includes(mode)) { showGate(mode); return; }
  $('#acctBtn').hidden = !me;
  $('#adminBtn').hidden = !(me && me.role === 'owner' && mode === 'ok');   // the owner manages accounts from here
  renderAcctBtn();
  if (mode === 'ok') {
    if (me) prefetchGets(['api/youtube/status', 'api/settings/public', 'api/imports', 'api/matches', 'api/me/data']);
    await connectServer();
    try { const ys = await api('GET', 'api/youtube/status'); yt.enabled = !!ys.enabled; yt.keys = ys.keys || []; yt.searchesLeft = ys.unlimited ? null : typeof ys.searchesLeft === 'number' ? ys.searchesLeft : null; } catch (e) {}
    { const t = TRACKS[state.current]; $$('.ver-btn').forEach(b => b.hidden = !(t && (t.sp || t.yt || t.src))); }   // the song from before the refresh
    if (yt.enabled) YTEng.api().catch(() => {});   // load YouTube's player early so the first click starts instantly
    setTimeout(askForEmail, 1500);
    await loadSpotify();
    queueGenreGuess();
    pollYtJobs();
  }
  const saved = mode === 'demo' ? [] : await loadOffline();
  // Downloaded YouTube songs (and which Spotify songs they stand in for), online or not.
  saved.filter(r => r.yt).forEach(r => { addYtTrack(r.yt); if (r.spKey) sp.matches[r.spKey] = { ...(sp.matches[r.spKey] || {}), yt: r.yt }; });
  if (server.on) {
    // Downloads of songs that were deleted from the server are no longer needed.
    for (const r of saved) if (r.meta && !r.yt && !TRACKS[r.id] && (r.server || remote.base) === remote.base) await dropDownload(r.id);
  } else if (saved.length) {
    // Server unreachable: show what's saved on this device.
    server.offlineMode = true;
    saved.filter(r => r.meta).forEach(r => addServerTrack(r.meta));
  }
  // Offline because no server answered: keep checking quietly and reconnect once one does (after the song, if one is playing).
  if (mode === 'offline') {
    const bases = [remote.base, ...SERVERS.map(x => normalizeServer(x.url))].filter((v, i, a) => v && a.indexOf(v) === i);
    let checking = false;
    const retry = async () => {
      if (checking || updateWaiting || document.visibilityState === 'hidden') return;
      checking = true;
      try { if (await firstServer(bases)) { updateWaiting = true; applyUpdateIfIdle(); } } finally { checking = false; }
    };
    setInterval(retry, 30e3);
    window.addEventListener('online', retry);
    document.addEventListener('visibilitychange', retry);
  }
  if (me) await loadUserData();
  loadYtKept(); setTimeout(matchLikesInBackground, 8000);
  rebuildUploadAlbums();
  state.liked = new Set([...state.liked].filter(visible));
  state.playlists.forEach(p => { p.tracks = p.tracks.filter(visible); });
  state.recent = state.recent.filter(k => k !== 'album:uploads' || server.on);
  $('#upBtn').hidden = !canEditMusic();
  if (!restoreResume()) resetPlayback();
  {
    const hs = history.state || {}, fromHash = viewFromHash();
    state.view = fromHash.view;
    if (state.view.name === 'search') { state.search = fromHash.q || hs.search || ''; const q = $('#tq'); if (q) { q.value = state.search; const c = $('#tqClear'); if (c) c.hidden = !state.search; } }
    hist.i = hs.i || 0; if (hist.top < hist.i) setHistTop(hist.i);
    histSave();
  }
  render();
  if (history.state && history.state.scroll) { const y = history.state.scroll; requestAnimationFrame(() => { $('#main').scrollTop = y; }); }
  if (state.view.name === 'search' && state.search) runCatalogSearch(state.search);
  window.addEventListener('popstate', e => {
    const st = e.state || {};
    hist.i = st.i || 0;
    let v = st.murmurView || viewFromHash().view;
    if (v.name === 'collection' && !getCollection(v.type, v.id)) v = { name: 'home' };
    state.search = v.name === 'search' ? (st.search || '') : '';
    const q = $('#tq'); if (q) { q.value = state.search; const c = $('#tqClear'); if (c) c.hidden = !state.search; }
    closeDrop(); if (!$('#modal').hidden && !modalRequired) closeModal();
    navigate(v, false);
    if (st.scroll) requestAnimationFrame(() => { $('#main').scrollTop = st.scroll; });
    if (v.name === 'search' && state.search) runCatalogSearch(state.search);
  });
  let scrollTimer = null;
  $('#main').addEventListener('scroll', () => { clearTimeout(scrollTimer); scrollTimer = setTimeout(() => histSave({ scroll: $('#main').scrollTop }), 200); }, { passive: true });
  requestAnimationFrame(frame);
  loadSuggestions();
  if (mode === 'ok') { spFinishLogin(); loadDiscover(); }   // coming back from the Spotify sign-in page
  setTimeout(() => { if ($('#modal').hidden) checkAppUpdate(); }, 4000);
  initDesktopUpdates();
  // Notice when the sign-in ends (90 days up, PIN changed, or removed by the owner).
  if (mode === 'ok') {
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState !== 'visible') return;
      try { const st = await getStatus(remote.base); if (st.setup && !st.user) { saveToken(null); showGate('expired'); } } catch (e) {}
    });
  }
})();
/* Android app: keep the same size on every screen. Opened directly on the Razr's cover screen, Android
   reports a lower pixel density and the page would shrink; scale it back up to match the inside screen. */
window.murmurFit = () => {
  const app = window.MurmurAndroid;
  if (!app || typeof app.displayInfo !== 'function') return;
  let info; try { info = JSON.parse(app.displayInfo()); } catch (e) { return; }
  const meta = document.querySelector('meta[name="viewport"]');
  if (!meta || !info.widthPx || !info.target) return;
  // Use the density the page is really drawn at. After a flip the page keeps the density of the screen it
  // was opened on, even though Android reports the new screen's; scaling by Android's number made it too big.
  info.density = window.devicePixelRatio || info.density;
  if (!info.density) return;
  // The zoom is always pinned (minimum = maximum), so moving between screens can't leave the
  // previous screen's zoom behind: the inside screen gets exactly 1, the cover screen its own scale.
  let content = 'width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
  if (info.density < info.target * 0.92) {
    const scale = info.target / info.density, width = Math.round(info.widthPx / info.target);
    content = `width=${width}, initial-scale=${scale.toFixed(3)}, minimum-scale=${scale.toFixed(3)}, maximum-scale=${scale.toFixed(3)}, user-scalable=no, viewport-fit=cover`;
  }
  if (meta.getAttribute('content') === content) return;
  meta.setAttribute('content', content);
  // New screen: things placed by measuring (menus, the YouTube box, the full player) are redone for it.
  closeMenu();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    placeYtBox();
    const f = $('#full'); if (f && !f.hidden) f.classList.toggle('scrolls', f.scrollHeight > f.clientHeight + 4);
  }));
};
window.murmurFit();
setTimeout(window.murmurFit, 500);   // in case the screen size wasn't known yet
let fitTimer = null;
window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(window.murmurFit, 150); });
/* The Android app's back button: close whatever is open, else go to Home. Returns false on Home. */
window.murmurBack = () => {
  if (!$('#tqDrop').hidden) { closeDrop(); return true; }
  if (!$('#modal').hidden) { closeModal(); return true; }
  if (!menuEl.hidden) { closeMenu(); return true; }
  if (!$('#full').hidden) { $('#full').hidden = true; return true; }
  if (state.sel || state.libSel) { clearSel(); return true; }
  if (!$('#gate').hidden) return false;
  // Back goes to the previous page, like a browser. With nothing before it, back goes to Home,
  // and on Home the app asks for a second swipe to exit.
  if (hist.i > 0) { history.back(); return true; }
  if (state.view.name !== 'home' || state.search) {
    state.search = ''; const q = $('#tq'); if (q) { q.value = ''; const c = $('#tqClear'); if (c) c.hidden = true; }
    navigate({ name: 'home' }); return true;
  }
  return false;
};
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; const b = $('#installBtn'); if (b) b.hidden = false; });
window.addEventListener('appinstalled', () => { installEvt = null; const b = $('#installBtn'); if (b) b.hidden = true; toast('Murmur is installed'); });
})();
</script>
