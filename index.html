<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120e17">
<meta name="description" content="Murmur: your self-hosted music player.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
</head>
<body>
<title>Murmur Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: three-pane shell (library rail · main stage · now-playing card) over a transport bar; phones collapse to stage + mini player + tab bar */
  --bg:#120e17; --panel:#1b1522; --raise:#251d2e; --hover:#2f2639; --line:#3b3048;
  --fg:#f5eff9; --muted:#a798b4; --accent:#ffb070; --accent-ink:#2b1505;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
img{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:8px;padding:8px}
.app.np-on{grid-template-columns:280px minmax(0,1fr) 310px}
.sidebar{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.main{grid-column:2;grid-row:1}
.np-panel{grid-column:3;grid-row:1}
.app:not(.np-on) .np-panel{display:none}
.player{grid-column:1/-1;grid-row:2}
.bottom-nav{grid-column:1/-1;grid-row:3;display:none}
.panel{background:var(--panel);border-radius:var(--r)}

.nav{padding:18px 12px 10px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:0 12px 14px;font:800 23px/1 var(--font-display);letter-spacing:-.02em}
.brand svg,.m-brand svg{width:26px;height:26px;color:var(--accent)}
.nav-btn{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:8px;font-weight:700;color:var(--muted)}
.nav-btn:hover,.nav-btn.on{color:var(--fg)}
.nav-btn svg{width:22px;height:22px}
.library{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 8px 8px}
.lib-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 10px}
.lib-head h2{margin:0;font:700 15px var(--font-body);color:var(--muted);display:flex;gap:12px;align-items:center}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none;position:relative}
.icon-btn:hover{color:var(--fg);background:var(--hover)}
.icon-btn.on{color:var(--accent)}
.icon-btn.rep-one::after{content:"1";position:absolute;top:3px;right:3px;font-size:9px;font-weight:800;line-height:1}
.chips{display:flex;gap:6px;padding:0 8px 10px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:var(--raise);font-size:13px;font-weight:600}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--fg);color:var(--bg)}
.lib-list{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.lib-item{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:8px;cursor:pointer;min-width:0}
.lib-item:hover{background:var(--raise)}
.lib-item.on{background:var(--hover)}
.lib-item .cover{width:48px;height:48px;border-radius:6px}
.lib-item .meta{min-width:0;flex:1}
.lib-item .nm{font-weight:600}
.lib-item.playing .nm{color:var(--accent)}
.lib-item .sb{font-size:13px;color:var(--muted)}

.cover{object-fit:cover;background:var(--raise);flex:none;aspect-ratio:1;max-width:100%}
.mosaic{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.mosaic img{width:100%;height:100%;object-fit:cover}
.liked-cover{display:grid;place-items:center;background:linear-gradient(140deg,#5b35c9 0%,#c06ad8 55%,#ffb070 100%);color:#fff}
.liked-cover svg{width:42%;height:42%;fill:currentColor}
.round{border-radius:50%!important}

.main{background:var(--panel);border-radius:var(--r);overflow:auto;min-width:0;position:relative;overscroll-behavior:contain;scrollbar-width:thin}
.topbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:12px 24px;background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.topbar .icon-btn{background:var(--bg)}
.topbar .icon-btn:disabled{opacity:.4;cursor:default}
.m-brand{display:none;margin-left:auto;align-items:center;gap:8px;font:800 19px var(--font-display)}
.view{padding:4px 24px 48px}

/* ---------- home ---------- */
.greet{font:800 clamp(26px,3.4vw,34px)/1.1 var(--font-display);letter-spacing:-.02em;margin:8px 0 18px;text-wrap:balance}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.qt{display:flex;align-items:center;gap:12px;background:var(--raise);border-radius:6px;overflow:hidden;cursor:pointer;min-width:0;padding-right:10px}
.qt:hover{background:var(--hover)}
.qt .cover{width:60px;height:60px}
.qt .nm{font-weight:700;flex:1;min-width:0}
.qt .fab{position:static;width:36px;height:36px}
.shelf-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 10px}
.shelf-head h2{margin:0;font:700 22px/1.2 var(--font-display);letter-spacing:-.01em}
.shelf-head p{margin:0;color:var(--muted);font-size:14px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,184px);gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -10px;scrollbar-width:thin}
.card{padding:10px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{background:var(--raise)}
.card-art{position:relative}
.card-art .cover{width:100%;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card .nm{font-weight:700}
.card .sb{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fab{position:absolute;right:8px;bottom:8px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.fab svg{width:20px;height:20px}
.card:hover .fab,.qt:hover .fab,.fab:focus-visible,.fab.on{opacity:1;transform:none}
.fab:hover{transform:scale(1.06)!important}

/* ---------- collection ---------- */
.hero{display:flex;gap:24px;align-items:flex-end;padding:28px 24px 24px;margin:-4px -24px 0;background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 46%,var(--panel)) 0%,color-mix(in srgb,var(--tint) 14%,var(--panel)) 100%)}
.hero-cover{width:clamp(140px,20vw,232px);border-radius:8px;box-shadow:0 14px 44px rgba(0,0,0,.5)}
.hero-meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.hero-meta .eyebrow{color:var(--fg)}
.hero h1,.title-input{font:800 clamp(30px,5.4vw,72px)/1.02 var(--font-display);letter-spacing:-.03em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.title-input{background:transparent;border:0;border-bottom:2px dashed transparent;color:var(--fg);width:100%;padding:0;border-radius:0}
.title-input:hover,.title-input:focus{border-bottom-color:color-mix(in srgb,var(--fg) 40%,transparent);outline:none}
.hero-desc{margin:0;color:color-mix(in srgb,var(--fg) 78%,transparent);max-width:60ch}
.hero-sub{margin:0;font-size:14px;color:color-mix(in srgb,var(--fg) 78%,transparent)}
.hero-sub b{color:var(--fg)}
.actions{display:flex;align-items:center;gap:14px;padding:22px 0 18px;flex-wrap:wrap}
.big-play{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.4);transition:transform .15s}
.big-play:hover{transform:scale(1.05)}
.big-play svg{width:24px;height:24px}
.actions .icon-btn{width:42px;height:42px}
.actions .icon-btn svg{width:24px;height:24px}
.text-btn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.text-btn:hover{color:var(--fg);border-color:var(--muted)}
.text-btn.danger{color:#ff8e8e;border-color:#ff8e8e}

.tracks{display:flex;flex-direction:column}
.thead,.row{display:grid;grid-template-columns:28px minmax(0,4fr) minmax(0,3fr) 36px 48px 36px;align-items:center;gap:12px;padding:6px 12px;border-radius:6px}
.thead{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:8px;padding-bottom:8px}
.thead .r{text-align:right}
.row{cursor:pointer}
.row:hover{background:var(--raise)}
.row .num{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;display:flex;justify-content:flex-end}
.row .eq{display:none}
.row.is-current .t{color:var(--accent)}
.row.is-current.is-playing .n{display:none}
.row.is-current.is-playing .eq{display:inline-flex}
.ti{display:flex;gap:12px;align-items:center;min-width:0}
.ti img{width:42px;height:42px;border-radius:4px}
.ti .tx{min-width:0}
.t{display:block;font-weight:600}
.a{display:block;font-size:13px;color:var(--muted)}
.a button:hover,.p-artist:hover,.alb:hover,.full-artist:hover,.np-artist:hover{text-decoration:underline;color:var(--fg)}
.alb{color:var(--muted);font-size:14px;justify-self:start;max-width:100%}
.dur{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.row .icon-btn{width:32px;height:32px}
.row .like,.row .more{opacity:0}
.row:hover .like,.row:hover .more,.row .like.on,.row:focus-within .more{opacity:1}
.like.on{color:var(--accent)}
.like.on svg{fill:currentColor}
.add-btn{padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700}
.add-btn:hover{border-color:var(--fg)}
.row.plain{grid-template-columns:minmax(0,1fr) auto}
.eq{gap:2px;height:14px;align-items:flex-end}
.eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.27s}
.eq i:nth-child(3){animation-delay:-.53s}
@keyframes eq{from{height:3px}to{height:14px}}
.empty{padding:40px 0;color:var(--muted);max-width:46ch}
.empty h2{color:var(--fg);font:700 22px var(--font-display);margin:0 0 6px}

/* ---------- search ---------- */
.search-box{display:flex;align-items:center;gap:10px;background:var(--raise);border-radius:999px;padding:0 18px;max-width:480px;border:1px solid var(--line);margin:6px 0 4px}
.search-box:focus-within{border-color:var(--fg)}
.search-box input{flex:1;background:none;border:0;color:var(--fg);font:inherit;font-size:16px;padding:13px 0;outline:none;min-width:0}
.search-box svg{color:var(--muted)}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.gt{aspect-ratio:1.55;border-radius:10px;padding:14px 16px;font:800 21px/1.1 var(--font-display);position:relative;overflow:hidden;cursor:pointer;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.gt small{font:600 12px var(--font-body);opacity:.8;letter-spacing:.02em}
.gt img{position:absolute;width:44%;right:-6%;bottom:-6%;transform:rotate(18deg);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.gt span{position:relative;z-index:1;max-width:60%}
.artist-chips{display:flex;flex-wrap:wrap;gap:8px}
.ac{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;background:var(--raise);border-radius:999px;font-weight:600}
.ac:hover{background:var(--hover)}
.ac img{width:36px;height:36px;border-radius:50%;object-fit:cover}

/* ---------- player ---------- */
.player{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);align-items:center;gap:16px;padding:6px 8px 2px;min-height:76px;position:relative}
.p-left{display:flex;align-items:center;gap:12px;min-width:0}
.p-cover{width:56px;height:56px;border-radius:6px;cursor:pointer}
.p-meta{min-width:0}
.p-title{font-weight:700;font-size:14px}
.p-artist,.np-artist,.full-artist{font-size:13px;color:var(--muted);display:block;max-width:100%}
.p-center{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.controls{display:flex;align-items:center;gap:12px}
.play-btn{width:38px;height:38px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;transition:transform .12s;flex:none}
.play-btn:hover{transform:scale(1.06)}
.seek-row{display:flex;align-items:center;gap:10px;width:100%;max-width:640px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seek-row span{min-width:34px;text-align:center}
.p-right{display:flex;justify-content:flex-end;align-items:center;gap:2px}
.vol{width:110px!important}
.p-mini,.mini-bar{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fg) var(--p),var(--line) var(--p))}
input[type=range]:hover::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--fg);margin-top:-4px;opacity:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--fg)}
input[type=range]:hover::-moz-range-progress{background:var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--fg)}

/* ---------- now playing panel ---------- */
.np-panel{overflow:auto;min-width:0;padding:16px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.np-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.np-cover{width:100%;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.np-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.np-meta h3{margin:0;font:800 22px/1.15 var(--font-display);letter-spacing:-.01em}
.np-card{background:var(--raise);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.np-card-head{display:flex;justify-content:space-between;align-items:center}
.np-card-head button{font-size:13px;font-weight:700;color:var(--muted)}
.np-card-head button:hover{color:var(--fg);text-decoration:underline}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted);margin:0}
.prog{font-family:var(--font-display);font-weight:600;color:var(--fg);letter-spacing:.02em}

/* ---------- full player ---------- */
.full{position:fixed;inset:0;z-index:40;overflow:auto;background:linear-gradient(180deg,color-mix(in srgb,var(--tint,#5a3478) 55%,var(--bg)) 0%,var(--bg) 78%);padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.full-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.full-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;text-align:center}
.full-top .eyebrow{color:var(--fg);opacity:.8;display:block}
.full-ctx b{font-weight:700;font-size:14px;display:block}
.full-cover{width:min(100%,46vh);align-self:center;border-radius:10px;box-shadow:0 22px 56px rgba(0,0,0,.55)}
#viz{width:100%;height:52px;display:block}
.full-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.full-meta>div{min-width:0}
.full-title{font:800 26px/1.15 var(--font-display);letter-spacing:-.01em}
.full-artist{font-size:15px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.controls.big{justify-content:space-between}
.controls.big .play-btn{width:66px;height:66px}
.controls.big .play-btn svg{width:28px;height:28px}
.controls.big .icon-btn{width:44px;height:44px}
.controls.big .icon-btn svg{width:26px;height:26px}

/* ---------- menu / toast ---------- */
.menu{position:fixed;z-index:60;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:230px;max-width:calc(100vw - 16px);max-height:70vh;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.menu-title{padding:8px 12px 6px;font-size:12px;color:var(--muted);font-weight:700}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:5px;font-size:14px;font-weight:500}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.toast.show{animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- uploads ---------- */
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.up-btn{display:flex;align-items:center;gap:8px;color:var(--fg);background:var(--bg)}
.dl-dot{display:none;color:var(--accent);margin-right:5px;vertical-align:-2px}
.dl-dot svg{width:13px;height:13px}
.row.is-dl .dl-dot{display:inline-block}
.row.is-dling .t::after{content:" · downloading";color:var(--muted);font-weight:500;font-size:12px}
.dl-btn.on{color:var(--accent)}
.dl-btn.busy{color:var(--accent);animation:dlpulse 1.1s ease-in-out infinite}
@keyframes dlpulse{50%{opacity:.35}}
.dl-cover{background:linear-gradient(140deg,#1d6b5a 0%,#3a8f7a 50%,#ffb070 100%)}
.dl-cover svg{fill:none}
.offline-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 16px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--accent) 12%,var(--raise));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);font-size:14px}
.offline-banner>svg{color:var(--accent);flex:none}
.offline-banner span{flex:1;min-width:12rem}
.up-btn svg{width:18px;height:18px}
.drop{display:flex;align-items:center;gap:16px;padding:20px;margin-bottom:20px;border:2px dashed var(--line);border-radius:12px;cursor:pointer;color:var(--fg)}
.drop:hover,.drop:focus-visible{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.drop>svg{width:30px;height:30px;color:var(--accent)}
.drop>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.empty code,.drop code{font-size:13px;background:var(--raise);padding:1px 6px;border-radius:4px}

let seeking = false;
function frame() {
  const pos = Engine.position(), dur = Engine.duration || 1, pct = state.current ? pos / dur : 0;
  if (!seeking) $$('[data-seek]').forEach(r => { r.value = Math.round(pct * 1000); r.style.setProperty('--p', (pct * 100) + '%'); });
  if (!seeking) $$('[data-pos]').forEach(s => s.textContent = fmt(state.current ? pos : 0));
  $('#miniBar').style.width = (pct * 100) + '%';

}
const vizData = new Uint8Array(64);
function drawViz() {
  const c = $('#viz'), dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (!w) return;
  if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
  if (Engine.analyser) Engine.analyser.getByteFrequencyData(vizData); else vizData.fill(0);
  const N = 40, gap = 3, bw = (w - gap * (N - 1)) / N;
  x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ffb070';
  for (let i = 0; i < N; i++) {
    const v = vizData[Math.min(63, 1 + Math.floor(i * 1.3))] / 255;
    const bh = Math.max(2, v * h);
    x.globalAlpha = .45 + v * .55;
    x.beginPath(); if (x.roundRect) x.roundRect(i * (bw + gap), h - bh, bw, bh, 2); else x.rect(i * (bw + gap), h - bh, bw, bh); x.fill();
  }
  x.globalAlpha = 1;
}

/* ================= actions ================= */
function setLiked(ids, on) {

function toggleLike(tid) {

function createPlaylist(tracks = []) {
  let n = state.playlists.length + 1;
  while (state.playlists.some(p => p.name === `My Playlist #${n}`)) n++;
  const p = { id: 'u-' + Date.now().toString(36), name: `My Playlist #${n}`, tracks: [...new Set(tracks)] };

function addToPlaylist(pid, tids) {

  const fresh = tids.filter(t => !p.tracks.includes(t));
  if (!fresh.length) { toast(tids.length > 1 ? `Those songs are already in ${p.name}` : `Already in ${p.name}`); return; }
  p.tracks.push(...fresh); savePlaylists();
  toast(`Added ${fresh.length > 1 ? plural(fresh.length, 'song') : 'to'} ${fresh.length > 1 ? 'to ' : ''}${p.name}${fresh.length < tids.length ? ` · ${tids.length - fresh.length} already there` : ''}`);
  if (state.view.name === 'collection' && state.view.id === pid) render(); else renderSidebar();
}
function addToQueue(tids) {
  state.manual.push(...tids);
  toast(tids.length > 1 ? `Added ${plural(tids.length, 'song')} to the queue` : 'Added to queue');
  renderNP(); refreshQueueView();
}
function confirmRemoveTracks(ids) {
  const files = ids.filter(id => TRACKS[id].src).length, demo = ids.length - files;
  const lines = [];
  if (files) lines.push(`<p><b>${plural(files, 'file')}</b> will be permanently deleted from your Murmur server. This can’t be undone.</p>`);
  if (demo) lines.push(`<p><b>${plural(demo, 'demo song')}</b> will be removed from your library. You can bring ${demo > 1 ? 'them' : 'it'} back from Your Library.</p>`);
  lines.push('<p>They’ll also be taken out of your playlists and Liked Songs.</p>');
  const one = ids.length === 1 ? `“${esc(TRACKS[ids[0]].title)}”` : plural(ids.length, 'song');
  openModal({ title: `${files ? 'Delete' : 'Remove'} ${one}?`, html: lines.join(''), confirm: files ? 'Delete' : 'Remove', danger: true, onSubmit: () => removeTracks(ids) });
}
function describeCollections(keys) {
  let userPl = 0, curPl = 0, demoAlb = 0, upAlb = 0, files = 0;
  keys.forEach(k => {
    const i = k.indexOf(':'), type = k.slice(0, i), id = k.slice(i + 1);
    if (type === 'playlist') { if (state.playlists.some(p => p.id === id)) userPl++; else curPl++; }
    else if (type === 'album') { const a = ALBUM_MAP[id]; if (!a) return; if (a.uploaded) { upAlb++; files += a.trackIds.length; } else demoAlb++; }
  });
  return { userPl, curPl, demoAlb, upAlb, files };
}
function confirmDeleteCollections(keys) {
  const d = describeCollections(keys), lines = [];
  if (d.upAlb) lines.push(`<p><b>${plural(d.upAlb, 'uploaded album')}</b> with <b>${plural(d.files, 'file')}</b> will be permanently deleted from your Murmur server. This can’t be undone.</p>`);
  if (d.userPl) lines.push(`<p><b>${plural(d.userPl, 'playlist')}</b> will be deleted. The songs in ${d.userPl > 1 ? 'them' : 'it'} stay in your library.</p>`);
  if (d.demoAlb || d.curPl) lines.push(`<p><b>${[d.demoAlb ? plural(d.demoAlb, 'demo album') : '', d.curPl ? plural(d.curPl, 'Murmur playlist') : ''].filter(Boolean).join(' and ')}</b> will be removed from your library. You can restore ${d.demoAlb + d.curPl > 1 ? 'them' : 'it'} from Your Library.</p>`);
  let name = plural(keys.length, 'item');
  if (keys.length === 1) { const i = keys[0].indexOf(':'), c = getCollection(keys[0].slice(0, i), keys[0].slice(i + 1)); if (c) name = `“${esc(c.title)}”`; }
  const verb = d.upAlb || d.userPl ? 'Delete' : 'Remove';
  openModal({ title: `${verb} ${name}?`, html: lines.join(''), confirm: verb, danger: true, onSubmit: () => deleteCollections(keys) });
}
async function deleteCollections(keys) {
  const trackIds = [];
  let msg = [];
  keys.forEach(k => {
    const i = k.indexOf(':'), type = k.slice(0, i), id = k.slice(i + 1);
    if (type === 'playlist') {
      if (state.playlists.some(p => p.id === id)) {
        state.playlists = state.playlists.filter(p => p.id !== id);
        state.recent = state.recent.filter(r => r !== k);
      } else state.hiddenCols.add(id);
    } else if (type === 'album') {
      const a = ALBUM_MAP[id]; if (a) trackIds.push(...a.trackIds.filter(visible));
    }
  });
  savePlaylists(); store.set('recent', state.recent); store.set('hiddenCols', [...state.hiddenCols]);
  state.back = state.back.filter(v => !(v.name === 'collection' && keys.includes(v.type + ':' + v.id)));
  state.fwd = [];
  if (trackIds.length) { const ok = await removeTracks(trackIds); if (!ok) { render(); return; } }
  state.libSel = null; state.sel = null;
  if (state.view.name === 'collection' && !getCollection(state.view.type, state.view.id)) state.view = { name: 'home' };
  render();
  toast(keys.length > 1 ? `Done · ${plural(keys.length, 'item')} removed` : 'Done');
}
function openEdit(tids, o = {}) {
  const ts = tids.map(id => TRACKS[id]).filter(t => t && t.src);
  if (!ts.length) return;
  const one = ts.length === 1 && !o.album ? ts[0] : null;
  const f = (name, label, val, ph) => `<div class="field"><label for="ed-${name}">${label}</label><input id="ed-${name}" name="${name}" value="${esc(val || '')}" placeholder="${esc(ph || '')}" autocomplete="off" maxlength="200"></div>`;
  let html, title;
  if (one) {
    title = 'Edit details';

  } else if (o.album) {
    const a = ALBUM_MAP[o.album];
    title = 'Edit album';
    html = `<p>Changes apply to all ${plural(ts.length, 'song')} on this album.</p>` + f('album', 'Album name', a.title) + f('artist', 'Artist', a.artist === 'Various artists' ? '' : a.artist, 'Keep each song’s artist');

    res.tracks.forEach(addServerTrack);
    res.tracks.forEach(r => {   // keep the offline copy's details in step
      const id = 'f-' + r.id;

function act(el, e) {
  const d = el.dataset;
  switch (d.act) {
    case 'nav': navigate({ name: d.to }); break;
    case 'open':
      if (!d.id) return;
      navigate({ name: 'collection', type: d.type, id: d.id }); break;
    case 'play-col':
      if (sameCtx(d.type, d.id)) togglePlay(); else playFrom(d.type, d.id, null);
      break;
    case 'play-track': {
      const list = el.closest('[data-ctx-type]'); if (!list) return;
      const type = list.dataset.ctxType, id = list.dataset.ctxId, i = +d.i;
      if (selMatches(type, id)) { toggleSel(i, e.shiftKey); return; }
      if (e.ctrlKey || e.metaKey || e.shiftKey) { startSel(type, id, i); return; }
      if (d.tid === state.current && sameCtx(type, id)) togglePlay(); else playFrom(type, id, i);
      break;
    }
    case 'toggle': togglePlay(); break;
    case 'next': case 'next-now': next(false); break;
    case 'prev': prev(); break;
    case 'shuffle':
      state.shuffle = !state.shuffle; store.set('shuffle', state.shuffle);
      if (state.list.length) buildOrder(state.order[state.pos]);
      updateToggles(); renderNP(); refreshQueueView();
      toast(state.shuffle ? 'Shuffle on' : 'Shuffle off'); break;
    case 'repeat':
      state.repeat = { off: 'all', all: 'one', one: 'off' }[state.repeat]; store.set('repeat', state.repeat);
      updateToggles(); renderNP(); break;
    case 'like': toggleLike(d.tid); break;
    case 'more': {
      const list = el.closest('[data-ctx-type]');
      if (list && selMatches(list.dataset.ctxType, list.dataset.ctxId)) { toggleSel(+d.i, false); return; }
      openMenu(el, [d.tid], { ctxType: list ? list.dataset.ctxType : null, ctxId: list ? list.dataset.ctxId : null, idx: +d.i }); break;
    }
    case 'm': {
      const m = menuState; if (!m) return;
      const op = d.op, tids = m.tids;
      if (op === 'sub') { m.sub = true; renderMenu(); return; }
      if (op === 'back') { m.sub = false; renderMenu(); return; }
      if (op === 'delete' && !m.confirm) { m.confirm = true; renderMenu(); return; }
      closeMenu();
      if (op === 'dl') downloadTracks(tids);
      else if (op === 'undl') confirmRemoveDownloads(tids);
      else if (op === 'save') saveToDevice(tids[0]);
      else if (op === 'delete') removeTracks(tids);
      else if (op === 'hide') removeTracks(tids);
      else if (op === 'edit') openEdit(tids);
      else if (op === 'queue') addToQueue(tids);
      else if (op === 'like') { const on = !tids.every(t => state.liked.has(t)); setLiked(tids, on); toast(on ? 'Added to Liked Songs' : 'Removed from Liked Songs'); }
      else if (op === 'album') navigate({ name: 'collection', type: 'album', id: TRACKS[tids[0]].albumId });
      else if (op === 'artist') navigate({ name: 'collection', type: 'artist', id: TRACKS[tids[0]].artist });
      else if (op === 'new') {
        const p = createPlaylist(tids);
        toast(`Added ${tids.length > 1 ? plural(tids.length, 'song') + ' ' : ''}to ${p.name}`);
        navigate({ name: 'collection', type: 'playlist', id: p.id });
      }
      else if (op === 'add') { addToPlaylist(d.pid, tids); if (m.multi) clearSel(); }
      else if (op === 'remove') {
        const p = state.playlists.find(x => x.id === m.ctxId);
        if (p) { p.tracks.splice(m.idx, 1); savePlaylists(); toast(`Removed from ${p.name}`); render(); }
      }
      break;
    }
    /* song selection */
    case 'sel-start': if (selMatches(d.type, d.id)) clearSel(); else startSel(d.type, d.id, null); break;
    case 'sel-done': clearSel(); break;
    case 'sel-all': {
      const col = getCollection(state.sel.type, state.sel.id); if (!col) return;
      const all = state.sel.idx.size === col.tracks.length;
      state.sel.idx = new Set(all ? [] : col.tracks.map((_, i) => i)); state.sel.last = null; syncSel(); break;
    }
    case 'sel-like': {
      const ids = selIds(), on = !ids.every(id => state.liked.has(id));
      setLiked(ids, on); toast(`${on ? 'Added' : 'Removed'} ${plural(ids.length, 'song')} ${on ? 'to' : 'from'} Liked Songs`);
      syncSel(); break;
    }
    case 'sel-playlist': openMenu(el, selIds(), { sub: true, multi: true }); break;
    case 'sel-queue': addToQueue(selIds()); clearSel(); break;
    case 'sel-edit': openEdit(selIds()); break;
    case 'sel-dl': {
      const ids = selIds().filter(canDownload);
      if (ids.every(id => offline.has(id))) confirmRemoveDownloads(ids); else { downloadTracks(ids); clearSel(); }
      break;
    }
    case 'col-dl': {
      const col = getCollection(d.type, d.id); if (!col) return;
      const ids = col.tracks.filter(canDownload);
      if (ids.length && ids.every(id => offline.has(id))) confirmRemoveDownloads(ids); else downloadTracks(ids);
      break;
    }
    case 'dl-clear': confirmRemoveDownloads([...offline.keys()].filter(id => TRACKS[id])); break;
    case 'retry': location.reload(); break;
    /* account & people */
    case 'gate-remember': el.disabled = true; chooseRemember(d.v === '1'); break;
    case 'acct': openAccount(); break;
    case 'acct-people': closeModal(); people = null; navigate({ name: 'people' }); break;
    case 'acct-pin': closeModal(); openChangeMyPin(); break;
    case 'acct-out': closeModal(); signOut(); break;
    case 'acct-server': closeModal(); showGate('connect'); break;
    case 'p-edit': {
      const on = el.checked;
      api('PATCH', 'api/users/' + d.id, { canEdit: on })
        .then(() => { toast(on ? 'They can now add, edit and delete music' : 'They can now only listen and download'); loadPeople(); })
        .catch(err => { toast(err.message); loadPeople(); });
      break;
    }
    case 'p-pin': {
      const u = people && people.find(x => x.id === d.id); if (!u) return;
      if (u.id === me.id) { openChangeMyPin(); return; }
      openModal({ title: `New PIN for ${esc(u.name)}`, confirm: 'Save PIN', html: `<p>Their old PIN stops working and they’re signed out on every device. Give them the new PIN.</p>
        <div class="field"><label for="npPin">New 4-digit PIN</label><input id="npPin" name="pin" ${PIN_ATTRS}></div>`,
        onSubmit: async fd => { try { await api('PATCH', 'api/users/' + u.id, { pin: fd.get('pin') }); toast(`New PIN saved for ${u.name}`); loadPeople(); } catch (e) { toast(e.message); } } });
      break;
    }
    case 'p-del': {
      const u = people && people.find(x => x.id === d.id); if (!u) return;
      openModal({ title: `Delete ${esc(u.name)}?`, confirm: 'Delete', danger: true,
        html: `<p>Their PIN stops working right away and they’re signed out on ${u.sessions.length ? plural(u.sessions.length, 'device') : 'every device'}. Music they added stays in your library.</p>`,
        onSubmit: async () => { try { await api('DELETE', 'api/users/' + u.id); toast(`Deleted ${u.name}`); loadPeople(); } catch (e) { toast(e.message); } } });
      break;
    }
    case 'dev-out':
      api('DELETE', 'api/sessions/' + d.id)
        .then(() => { if (d.cur === '1') location.reload(); else { toast('Signed out that device'); loadPeople(); } })
        .catch(err => toast(err.message));
      break;
    case 'install':
      if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; $('#installBtn').hidden = true; }); }
      break;
    case 'sel-delete': confirmRemoveTracks(selIds()); break;
    case 'sel-remove': {
      const p = state.playlists.find(x => x.id === state.sel.id); if (!p) return;
      const idx = [...state.sel.idx].sort((a, b) => b - a), n = idx.length;
      idx.forEach(i => p.tracks.splice(i, 1)); savePlaylists();
      state.sel = null; render(); toast(`Removed ${plural(n, 'song')} from ${p.name}`); break;
    }
    /* library selection */
    case 'lib-sel': state.sel = null; state.libSel = state.libSel ? null : new Set(); render(); break;
    case 'lib-toggle': { const k = d.key; state.libSel.has(k) ? state.libSel.delete(k) : state.libSel.add(k); syncSel(); break; }
    case 'lib-all': {
      const keys = libEntries().filter(x => x.sel).map(x => x.type + ':' + x.id);
      state.libSel = new Set(state.libSel.size ? [] : keys); syncSel(); break;
    }
    case 'lib-playlist': { const ids = libSelTracks(); if (ids.length) openMenu(el, ids, { sub: true, multi: true }); else toast('Those are empty'); break; }
    case 'lib-queue': { const ids = libSelTracks(); if (ids.length) { addToQueue(ids); clearSel(); } break; }
    case 'lib-delete': confirmDeleteCollections([...state.libSel]); break;
    case 'col-delete': confirmDeleteCollections([d.type + ':' + d.id]); break;
    case 'album-edit': openEdit(ALBUM_MAP[d.id].trackIds, { album: d.id }); break;
    case 'edit-one': openEdit([d.tid]); break;
    case 'restore':
      state.hidden.clear(); state.hiddenCols.clear(); store.set('hidden', []); store.set('hiddenCols', []);
      render(); toast('Demo music restored'); break;
    case 'modal-close': closeModal(); break;
    case 'drop-close': hideDrop(); break;
    case 'new-pl': { const p = createPlaylist(); navigate({ name: 'collection', type: 'playlist', id: p.id }); setTimeout(() => { const i = $('#plName'); if (i) i.select(); }, 0); break; }
    case 'pl-add': addToPlaylist(state.view.id, [d.tid]); break;
    case 'lib-filter': state.libFilter = d.k; if (state.view.name === 'library') render(); else renderSidebar(); break;
    case 'back': if (state.back.length) { state.fwd.push(state.view); navigate(state.back.pop(), false); } break;
    case 'fwd': if (state.fwd.length) { state.back.push(state.view); navigate(state.fwd.pop(), false); } break;
    case 'q-jump': {
      const i = +d.i;
      if (d.kind === 'manual') { const [tid] = state.manual.splice(i, 1); loadAndPlay(tid, true); }
      else { state.pos = state.pos + 1 + i; loadAndPlay(curId(), true); }
      render(); break;
    }
    case 'q-clear': state.manual = []; renderNP(); render(); break;
    case 'mute': state.muted = !state.muted; Engine.setVolume(); updateToggles(); break;
    case 'np-toggle': state.npOpen = !state.npOpen; store.set('npOpen', state.npOpen); updateToggles(); break;
    case 'expand': if (state.current) { $('#full').hidden = false; closeMenu(); } break;
    case 'expand-m': if (state.current && matchMedia('(max-width:760px)').matches) $('#full').hidden = false; break;
    case 'full-close': $('#full').hidden = true; break;
    case 'upload': $('#fileGlobal').click(); break;
    case 'go-queue': $('#full').hidden = true; navigate({ name: 'queue' }); break;
  }
}

document.addEventListener('input', e => {

    seeking = true;

    t.style.setProperty('--p', (t.value / 10) + '%');
    $$('[data-pos]').forEach(s => s.textContent = fmt(pos));
  } else if (t.matches('[data-vol]')) {

    Engine.setVolume(); updateToggles();

    state.search = t.value; state.sel = null; $('#results').innerHTML = searchResultsHTML(); highlight(); syncSel();
  }

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fileGlobal') { uploadFiles(t.files); t.value = ''; return; }
  if (t.matches('[data-seek]')) { Engine.seek(t.value / 1000 * Engine.duration); seeking = false; }
  else if (t.id === 'plName') {
    const p = state.playlists.find(x => x.id === t.dataset.pid); if (!p) return;
    const v = t.value.trim();
    if (v) { p.name = v; savePlaylists(); renderSidebar(); if (sameCtx('playlist', p.id)) state.ctx.title = v; toast('Playlist renamed'); }
    else t.value = p.name;
  }
});
document.addEventListener('pointerup', () => { if (seeking) setTimeout(() => { seeking = false; }, 50); });
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (e.key === 'Escape') {
    if (!$('#dropOverlay').hidden) hideDrop();
    else if (!$('#modal').hidden) closeModal();
    else if (!menuEl.hidden) closeMenu();
    else if (!$('#full').hidden) $('#full').hidden = true;
    else if (state.sel || state.libSel) clearSel();
    return;
  }
  if (!$('#modal').hidden || !$('#gate').hidden) return;
  if (e.target.id === 'plName' && e.key === 'Enter') { e.target.blur(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === ' ' && !['INPUT', 'TEXTAREA', 'BUTTON', 'SELECT'].includes(tag)) { e.preventDefault(); togglePlay(); }
});

/* Drag-and-drop: the overlay hides itself as soon as the drag stops reaching the page,
   and a click or Esc always dismisses it. */
let dropTimer = null;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
function showDrop() { $('#dropOverlay').hidden = false; clearTimeout(dropTimer); dropTimer = setTimeout(hideDrop, 350); }
function hideDrop() { clearTimeout(dropTimer); $('#dropOverlay').hidden = true; }
document.addEventListener('dragenter', e => { if (hasFiles(e) && canEditMusic()) { e.preventDefault(); showDrop(); } });
document.addEventListener('dragover', e => { if (hasFiles(e) && canEditMusic()) { e.preventDefault(); showDrop(); } });
document.addEventListener('drop', e => {
  hideDrop();
  if (!hasFiles(e)) return;
  e.preventDefault();
  uploadFiles(e.dataTransfer.files);
});
window.addEventListener('blur', hideDrop);

/* ================= sign-in (Docker server only) ================= */
const PIN_ATTRS = 'type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" minlength="4" required autocomplete="off" class="pin"';
async function getStatus(base) {
  const r = await fetch(joinUrl(base, 'api/auth/status'), { cache: 'no-store', headers: base ? authHeaders() : {} });
  if (!r.ok) throw new Error();
  const st = await r.json();
  if (!st || typeof st.setup !== 'boolean') throw new Error();
  return st;
}
async function checkAuth() {
  let st = null;
  try { st = await getStatus(''); } catch (e) {}   // is this page served by the Murmur server itself?
  if (!st) {
    const base = savedServer();
    if (!base) {
      if (cfg) return 'connect';                     // hosted copy with no server address yet
      const c = store.get('auth', null);             // the claude.ai demo, or opened offline
      if (c && c.expiresAt > Date.now()) { me = c; return 'offline'; }
      return c ? 'offline-expired' : 'demo';
    }
    remote.base = normalizeServer(base); loadToken();
    try { st = await getStatus(remote.base); } catch (e) {
      const c = store.get('auth', null);
      if (c && c.expiresAt > Date.now()) { me = c; return 'offline'; }
      return 'unreachable';
    }
  }
  server.auth = true;
  if (!st.setup) return 'setup';
  if (!st.user) { if (remote.base) saveToken(null); return store.get('auth', null) ? 'expired' : 'login'; }
  me = st.user;
  if (st.user.mediaKey) remote.mediaKey = st.user.mediaKey;
  store.set('auth', st.user);
  return 'ok';
}
function showGate(step, msg = '') {
  const g = $('#gate'), lastName = store.get('lastName', '');
  closeMenu(); if (!$('#modal').hidden) closeModal();
  const card = (title, sub, form) => `<div class="gate-card"><div class="brand gate-brand">${LOGO}<span>Murmur</span></div>
    <h1>${title}</h1><p class="gate-sub">${sub}</p>${form}</div>`;
  const err = msg ? `<p class="gate-err" role="alert">${esc(msg)}</p>` : '';
  let html;
  if (step === 'setup') {
    html = card('Set up Murmur', 'You’re the first one here, so this will be the owner account. Pick your name and a 4-digit PIN. You’ll use them to sign in and to let other people in.',
      `<form id="gForm" data-step="setup" class="gate-form">
        <div class="field"><label for="gName">Your name</label><input id="gName" name="name" maxlength="40" required autocomplete="username" value="${esc(lastName)}"></div>
        <div class="field"><label for="gPin">Choose a 4-digit PIN</label><input id="gPin" name="pin" ${PIN_ATTRS}></div>
        <div class="field"><label for="gPin2">Type the PIN again</label><input id="gPin2" name="pin2" ${PIN_ATTRS}></div>
        ${err}<button class="m-ok gate-ok" type="submit">Create my account</button></form>`);
  } else if (step === 'remember') {
    html = card(`Hi, ${esc(me ? me.name : '')}`, 'Remember this computer? You’ll stay signed in here for 90 days, then Murmur asks for your PIN again. Don’t choose this on a shared or public computer.',
      `<div class="gate-form"><button class="m-ok gate-ok" data-act="gate-remember" data-v="1">Yes, remember for 90 days</button>
       <button class="text-btn gate-alt" data-act="gate-remember" data-v="0">No, just this time</button></div>`);
  } else if (step === 'connect' || step === 'unreachable') {
    const addr = remote.base || savedServer();
    html = card(step === 'connect' ? 'Connect to your Murmur' : 'Can’t reach your Murmur server',
      step === 'connect' ? 'Enter the address of the Murmur server that holds your music. You’ll sign in with your name and PIN next.'
        : `Murmur couldn’t connect to <b>${esc(addr)}</b>. Check that the server is running and the address is right, then try again.`,
      `<form id="gForm" data-step="server" class="gate-form">
        <div class="field"><label for="gServer">Server address</label><input id="gServer" name="server" required autocomplete="url" inputmode="url" placeholder="https://murmur.example.com" value="${esc(addr)}"></div>
        ${err}<button class="m-ok gate-ok" type="submit">Connect</button></form>`);
  } else if (step === 'offline-expired') {
    html = card('Can’t reach your Murmur server', 'Your sign-in on this device has ended, and signing in again needs a connection to your server. Your downloaded songs unlock once you’re signed in.',
      `<div class="gate-form">${err}<button class="m-ok gate-ok" data-act="retry">Try again</button></div>`);
  } else {
    const expired = step === 'expired';
    html = card(expired ? 'Please sign in again' : 'Sign in', expired ? 'Your sign-in ended, or the owner changed your access. Enter your name and PIN to keep using Murmur.' : 'Enter your name and 4-digit PIN.',
      `<form id="gForm" data-step="login" class="gate-form">
        <div class="field"><label for="gName">Name</label><input id="gName" name="name" maxlength="40" required autocomplete="username" value="${esc(lastName)}"></div>
        <div class="field"><label for="gPin">PIN</label><input id="gPin" name="pin" ${PIN_ATTRS}></div>
        ${err}<button class="m-ok gate-ok" type="submit">Sign in</button>
        <p class="small">Don’t have a PIN? Ask the person who runs this Murmur to add you.</p></form>`);
  }
  g.innerHTML = html; g.hidden = false;
  const f = (lastName && $('#gPin')) || $('#gName') || g.querySelector('button');
  if (f) setTimeout(() => f.focus(), 0);
}
async function gateSubmit(form) {
  const fd = new FormData(form), step = form.dataset.step;
  if (step === 'server') {
    const addr = normalizeServer(fd.get('server'));
    if (!addr) { showGate('connect', 'Enter the server address.'); return; }
    store.set('server', addr); saveToken(null); store.set('auth', null);
    location.reload(); return;
  }
  const name = String(fd.get('name') || '').trim(), pin = String(fd.get('pin') || '');
  if (!/^\d{4}$/.test(pin)) { showGate(step, 'Your PIN must be exactly 4 digits.'); return; }
  if (step === 'setup' && pin !== fd.get('pin2')) { showGate('setup', 'Those two PINs don’t match. Try again.'); return; }
  const btn = form.querySelector('.gate-ok'); if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }
  try {
    const res = await api('POST', step === 'setup' ? 'api/auth/setup' : 'api/auth/login', { name, pin });
    store.set('lastName', name);
    if (res.token) saveToken(res.token, res.mediaKey, false);   // signed in from another site (GitHub Pages)
    me = res.user;
    showGate('remember');
  } catch (e) { showGate(step === 'setup' ? 'setup' : 'login', e.message); }
}
async function chooseRemember(yes) {
  try {
    const res = await api('POST', 'api/auth/remember', { remember: yes });
    store.set('auth', res.user);
    if (yes && remote.token) saveToken(remote.token, remote.mediaKey, true);   // keep the sign-in after the browser closes
  } catch (e) {}
  location.reload();
}
async function signOut() {
  try { await api('POST', 'api/auth/logout'); } catch (e) {}
  store.set('auth', null); saveToken(null);
  location.reload();
}
const roleLabel = u => u.role === 'owner' ? 'Owner' : u.canEdit ? 'Can add, edit and delete music' : 'Listen and download only';
const when = ms => new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
function ago(ms) {
  const m = Math.round((Date.now() - ms) / 60000);
  return m < 2 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
}
function openAccount() {
  if (!me) return;
  const until = me.remembered ? `Remembered on this computer until <b>${when(me.expiresAt)}</b>.` : 'Signed in for this visit only. You’ll need your PIN again after 12 hours or when the browser closes.';
  const where = remote.base ? `<p>Server: <b>${esc(remote.base)}</b></p>` : '';
  openModal({ title: esc(me.name), confirm: 'Done', html: `<p>${esc(roleLabel(me))}</p><p>${server.offlineMode ? 'You’re offline right now.' : until}</p>${where}
    <div class="acct-actions">
      ${me.role === 'owner' && server.on ? `<button type="button" class="text-btn" data-act="acct-people">${icon('user')}<span>Manage people</span></button>` : ''}
      ${server.on ? `<button type="button" class="text-btn" data-act="acct-pin">${icon('edit')}<span>Change my PIN</span></button>` : ''}
      ${server.on ? `<button type="button" class="text-btn" data-act="acct-out">${icon('back')}<span>Sign out</span></button>` : ''}
      ${remote.base || cfg ? `<button type="button" class="text-btn" data-act="acct-server">${icon('cloudOff')}<span>Use a different server</span></button>` : ''}
    </div>`, onSubmit: () => {} });
}
function openChangeMyPin() {
  openModal({ title: 'Change my PIN', confirm: 'Save PIN', html: `<p>Your other devices will be signed out.</p>
    <div class="field"><label for="cpOld">Current PIN</label><input id="cpOld" name="current" ${PIN_ATTRS}></div>
    <div class="field"><label for="cpNew">New PIN</label><input id="cpNew" name="pin" ${PIN_ATTRS}></div>`,
    onSubmit: async fd => {
      try { await api('POST', 'api/me/pin', { current: fd.get('current'), pin: fd.get('pin') }); toast('PIN changed'); }
      catch (e) { toast(e.message); }
    } });
}

/* ---------- People (owner) ---------- */
let people = null;
async function loadPeople() {
  try { people = (await api('GET', 'api/users')).users; } catch (e) { people = []; toast(e.message); }
  if (state.view.name === 'people') render();
}
function viewPeople() {
  if (!me || me.role !== 'owner') return `<div class="empty"><h2>Only the owner can manage people</h2></div>`;
  if (!people) { loadPeople(); return `<h1 class="greet">People</h1><p class="small">Loading…</p>`; }
  const person = u => {
    const devices = u.sessions.length ? u.sessions.map(s => `<li class="device">
        <div><b>${esc(s.device)}</b>${s.current ? ' <span class="badge">This device</span>' : ''}
        <span class="small">${s.remember ? `Remembered until ${when(s.expiresAt)}` : 'This visit only'} · last used ${ago(s.lastSeen)}</span></div>
        <button class="text-btn" data-act="dev-out" data-id="${s.id}" data-cur="${s.current ? 1 : 0}">Sign out</button></li>`).join('')
      : '<li class="small">Not signed in anywhere.</li>';
    return `<article class="person">
      <header class="person-head"><span class="avatar">${esc(u.name.slice(0, 1).toUpperCase())}</span>
        <div class="person-meta"><h3>${esc(u.name)}</h3><span class="small">${esc(roleLabel(u))} · added ${when(u.createdAt)}</span></div></header>
      <div class="person-actions">
        <button class="text-btn" data-act="p-pin" data-id="${u.id}">${icon('edit')}<span>${u.id === me.id ? 'Change my PIN' : 'Set new PIN'}</span></button>
        ${u.role === 'owner' ? '' : `<label class="switch"><input type="checkbox" data-act="p-edit" data-id="${u.id}" ${u.canEdit ? 'checked' : ''}><span>Can add, edit and delete music</span></label>
        <button class="text-btn danger" data-act="p-del" data-id="${u.id}">${icon('trash')}<span>Delete</span></button>`}
      </div>
      <ul class="devices" aria-label="Signed-in devices">${devices}</ul></article>`;
  };
  return `<h1 class="greet">People</h1>
  <p class="small" style="max-width:60ch">People you add sign in with their name and a 4-digit PIN. When they choose “Remember this computer” they stay signed in there for 90 days, then need their PIN again. Deleting someone signs them out everywhere.</p>
  <form id="addPerson" class="person-add">
    <div class="field"><label for="apName">Name</label><input id="apName" name="name" maxlength="40" required autocomplete="off"></div>
    <div class="field"><label for="apPin">4-digit PIN</label><input id="apPin" name="pin" ${PIN_ATTRS}></div>
    <label class="switch"><input type="checkbox" name="canEdit"><span>Can add, edit and delete music</span></label>
    <button class="m-ok" type="submit">Add person</button>
  </form>
  <div class="people">${people.map(person).join('')}</div>`;
}
async function addPerson(form) {
  const fd = new FormData(form);
  try {
    await api('POST', 'api/users', { name: String(fd.get('name') || '').trim(), pin: fd.get('pin'), canEdit: fd.get('canEdit') === 'on' });
    toast(`Added ${String(fd.get('name')).trim()}. Give them their PIN.`);
    loadPeople();
  } catch (e) { toast(e.message); }
}

/* ================= boot ================= */
(async () => {
  buildShell();
  $('#main').addEventListener('scroll', closeMenu, { passive: true });
  const mode = await checkAuth();
  if ((server.auth || cfg) && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
  if (['setup', 'login', 'expired', 'offline-expired', 'connect', 'unreachable'].includes(mode)) { showGate(mode); return; }
  $('#acctBtn').hidden = !me;
  if (me) $('#acctBtn').textContent = me.name.slice(0, 1).toUpperCase();
  if (mode === 'ok') await connectServer();
  const saved = mode === 'demo' ? [] : await loadOffline();
  if (server.on) {
    // Downloads of songs that were deleted from the server are no longer needed.
    for (const r of saved) if (!TRACKS[r.id]) await dropDownload(r.id);
  } else if (saved.length) {
    // Server unreachable: show what's saved on this device.
    server.offlineMode = true;
    saved.filter(r => r.meta).forEach(r => addServerTrack(r.meta));
  }
  rebuildUploadAlbums();
  state.liked = new Set([...state.liked].filter(visible));
  state.playlists.forEach(p => { p.tracks = p.tracks.filter(visible); });
  state.recent = state.recent.filter(k => k !== 'album:uploads' || server.on);
  $('#upBtn').hidden = !canEditMusic();
  resetPlayback();
  render();
  requestAnimationFrame(frame);
  // Notice when the sign-in ends (90 days up, PIN changed, or removed by the owner).
  if (mode === 'ok') {
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState !== 'visible') return;
      try { const st = await getStatus(remote.base); if (st.setup && !st.user) { saveToken(null); showGate('expired'); } } catch (e) {}
    });
  }
})();
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; const b = $('#installBtn'); if (b) b.hidden = false; });
window.addEventListener('appinstalled', () => { installEvt = null; const b = $('#installBtn'); if (b) b.hidden = true; toast('Murmur is installed'); });
})();
</script>
