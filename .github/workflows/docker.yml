# Builds the Murmur server image on GitHub and publishes it to GitHub's container registry,
# so any computer (PC, Mac, Linux server, Raspberry Pi) can run Murmur without building it:
#   ghcr.io/rodriguezcurielj/murmur:latest
# Built for 64-bit PCs and servers (amd64), Raspberry Pi 4/5 and Apple-chip-style ARM (arm64),
# and older 32-bit Raspberry Pi OS (arm/v7).
name: Server image

on:
  push:
    branches: [main]
    paths:
      - server.js
      - auth.js
      - youtube.js
      - spotify.js
      - discover.js
      - userdata.js
      - package.json
      - index.html
      - config.js
      - sw.js
      - manifest.webmanifest
      - icons/**
      - Docker/Dockerfile
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lets the amd64 runner build the ARM versions too.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/murmur
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
