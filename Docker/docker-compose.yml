name: murmur
services:
  murmur:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    image: murmur-player
    container_name: murmur
    ports:
      - "8080:8080"
    volumes:
      # Your music and accounts live in music-data/ at the repo root, so they survive rebuilds
      - ../music-data:/data
    environment:
      # Two-way sync with other Murmur servers (sync.js). Put these in a .env file next to this file (keep it private):
      #   MURMUR_SYNC_KEY=the same secret on every server
      #   MURMUR_PEERS=https://address-of-another-server   (only on a server that can reach the others)
      - MURMUR_SYNC_KEY=${MURMUR_SYNC_KEY:-}
      - MURMUR_PEERS=${MURMUR_PEERS:-}
      # Pages allowed to use this server: GitHub Pages plus the Murmur pages hosted on the tailnet.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://rodriguezcurielj.github.io,https://murmur-laptop.tail05789d.ts.net,https://murmur-laptop.tail05789d.ts.net:8443,https://murmur.tail05789d.ts.net}
    restart: unless-stopped

  # Gives the server a public https:// address so other computers (and the GitHub Pages
  # player) can reach it. Find the address with:  docker logs murmur-tunnel
  # This free "quick tunnel" gets a new random address each time it restarts.
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    container_name: murmur-tunnel
    command: tunnel --no-autoupdate --url http://murmur:8080
    depends_on:
      - murmur
    restart: unless-stopped
